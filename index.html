<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Multi-Réseaux & QR Code Studio Pro</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* DEFINITION SYSTEME DES THEMES */
    :root[data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --focus-ring: rgba(59, 130, 246, 0.3);
    }

    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }

    :root[data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(135deg, #0d0221 0%, #0f051d 100%);
      --card-bg: rgba(25, 10, 45, 0.75);
      --card-border: #facc15;
      --text-main: #00f6ff;
      --text-muted: #ff007f;
      --input-bg: rgba(10, 2, 25, 0.8);
      --accent-color: #facc15;
      --accent-hover: #eab308;
      --focus-ring: rgba(250, 204, 21, 0.4);
    }

    :root[data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #4c1d95 0%, #c2410c 100%);
      --card-bg: rgba(88, 28, 135, 0.45);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-main: #fff7ed;
      --text-muted: #fed7aa;
      --input-bg: rgba(67, 20, 96, 0.5);
      --accent-color: #fb923c;
      --accent-hover: #f97316;
      --focus-ring: rgba(251, 146, 60, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      max-width: 1080px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i { color: var(--accent-color); }

    /* Theme Switcher Responsive */
    .theme-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .theme-option {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .theme-option.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--focus-ring);
      color: var(--accent-color);
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem; /* Evite le zoom auto sur iOS */
      outline: none;
    }

    textarea {
      padding-left: 42px;
      resize: vertical;
      min-height: 65px;
    }

    input[type="text"]:focus, input[type="url"]:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    /* Preview Section Responsive */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .preview-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      display: inline-block;
    }

    .profile-header-preview {
      margin-bottom: 14px;
    }

    .profile-header-preview h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-header-preview .title-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-top: 2px;
    }

    .profile-header-preview p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 15px 25px -10px rgba(0,0,0,0.3);
      margin-bottom: 16px;
      display: inline-block;
    }

    .qr-container img, .qr-container canvas {
      max-width: 100%;
      height: auto !important;
    }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 14px 16px; /* Tactile optimal */
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .social-link-item:active {
      transform: scale(0.98);
    }

    .social-link-item i {
      font-size: 1.2rem;
      margin-right: 12px;
      width: 22px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 14px;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-png { background: #10b981; }
    .btn-svg { background: #f59e0b; }
    .btn-pdf { background: #ef4444; }

    /* Media Queries pour Smartphones */
    @media (max-width: 850px) {
      body { padding: 12px; }
      .container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .card { padding: 18px; }
      .theme-selector {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Dynamic Hub View Mode (Mobile-First) */
    body.hub-view { padding: 16px; }
    .hub-card {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container" id="editor-container">
    <!-- Configuration -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Choix du Thème
      </div>

      <!-- Thèmes -->
      <div class="theme-selector">
        <div class="theme-option active" data-theme="dark">
          <i class="fa-solid fa-moon"></i> Dark
        </div>
        <div class="theme-option" data-theme="light">
          <i class="fa-solid fa-sun"></i> Light
        </div>
        <div class="theme-option" data-theme="cyberpunk">
          <i class="fa-solid fa-bolt"></i> Cyber
        </div>
        <div class="theme-option" data-theme="sunset">
          <i class="fa-solid fa-volcano"></i> Sunset
        </div>
      </div>

      <div class="card-title">
        <i class="fa-solid fa-id-card"></i> Profil & Informations
      </div>

      <!-- Informations Personnelles -->
      <div class="form-group">
        <label>Nom du profil</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Jean Dupont" placeholder="Votre nom / marque">
        </div>
      </div>

      <div class="form-group">
        <label>Titre / Profession</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-briefcase"></i>
          <input type="text" id="profile-title" value="Designer & Développeur Front-End" placeholder="Ex: Designer & Développeur">
        </div>
      </div>

      <div class="form-group">
        <label>Brève Description / Bio</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-align-left" style="top: 14px;"></i>
          <textarea id="profile-bio" placeholder="Créateur de contenus numériques et solutions web sur mesure.">Créateur de contenus numériques et solutions web sur mesure.</textarea>
        </div>
      </div>

      <!-- Réseaux -->
      <div class="form-group">
        <label>WhatsApp</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-whatsapp"></i>
          <input type="text" class="social-input" data-platform="whatsapp" placeholder="Numéro (ex: 221770000000)">
        </div>
      </div>

      <div class="form-group">
        <label>Instagram</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" class="social-input" data-platform="instagram" placeholder="Nom d'utilisateur">
        </div>
      </div>

      <div class="form-group">
        <label>LinkedIn</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-linkedin"></i>
          <input type="text" class="social-input" data-platform="linkedin" placeholder="ID / Lien profil">
        </div>
      </div>

      <div class="form-group">
        <label>Site Web</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-globe"></i>
          <input type="url" class="social-input" data-platform="website" placeholder="https://votre-site.com">
        </div>
      </div>

      <label style="margin-top: 18px;">Couleurs QR Code</label>
      <div class="color-picker-grid">
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-dark" value="#0f172a">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Code</span>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-light" value="#ffffff">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Fond</span>
        </div>
      </div>
    </div>

    <!-- Aperçu et Exports -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <span class="preview-badge"><i class="fa-solid fa-eye"></i> Aperçu Temps Réel</span>
        
        <!-- En-tête profil -->
        <div class="profile-header-preview">
          <h3 id="prev-name">Jean Dupont</h3>
          <div class="title-tag" id="prev-title">Designer & Développeur Front-End</div>
          <p id="prev-bio">Créateur de contenus numériques et solutions web sur mesure.</p>
        </div>

        <div class="qr-container">
          <div id="qr-output"></div>
        </div>

        <div class="social-links-list" id="links-preview"></div>
      </div>

      <div class="btn-group">
        <button id="download-png" class="btn btn-png"><i class="fa-solid fa-image"></i> Exporter PNG</button>
        <button id="download-svg" class="btn btn-svg"><i class="fa-solid fa-vector-square"></i> Exporter SVG (Vectoriel)</button>
        <button id="download-pdf" class="btn btn-pdf"><i class="fa-solid fa-file-pdf"></i> Exporter PDF HD</button>
      </div>
    </div>
  </div>

  <script>
    const PLATFORMS = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/", icon: "fa-brands fa-linkedin", name: "LinkedIn" },
      website: { prefix: "", icon: "fa-solid fa-globe", name: "Site Web" }
    };

    const profileNameInput = document.getElementById('profile-name');
    const profileTitleInput = document.getElementById('profile-title');
    const profileBioInput = document.getElementById('profile-bio');

    const prevName = document.getElementById('prev-name');
    const prevTitle = document.getElementById('prev-title');
    const prevBio = document.getElementById('prev-bio');

    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const qrOutput = document.getElementById('qr-output');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');
    const themeOptions = document.querySelectorAll('.theme-option');

    let selectedTheme = 'dark';

    // Switcher de thème
    themeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        themeOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedTheme = opt.dataset.theme;
        document.documentElement.setAttribute('data-theme', selectedTheme);
        updateApp();
      });
    });

    function getActiveLinks() {
      const active = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website') {
            const clean = val.replace(/^https?:\/\/(www\.)?/, '').replace(/^@/, '');
            url = PLATFORMS[platform].prefix + clean;
          }
          active.push({ platform, url, name: PLATFORMS[platform].name, icon: PLATFORMS[platform].icon });
        }
      });
      return active;
    }

    function generateTargetURL(links) {
      const name = encodeURIComponent(profileNameInput.value.trim() || "Mon Hub Pro");
      const title = encodeURIComponent(profileTitleInput.value.trim());
      const bio = encodeURIComponent(profileBioInput.value.trim());
      
      const payload = links.map(l => `${l.platform}:${encodeURIComponent(l.url)}`).join('|');
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?hub=${name}&title=${title}&bio=${bio}&theme=${selectedTheme}&data=${btoa(payload)}`;
    }

    function updateApp() {
      prevName.textContent = profileNameInput.value.trim() || "Mon Hub Pro";
      prevTitle.textContent = profileTitleInput.value.trim();
      prevBio.textContent = profileBioInput.value.trim();

      prevTitle.style.display = profileTitleInput.value.trim() ? "block" : "none";
      prevBio.style.display = profileBioInput.value.trim() ? "block" : "none";

      const links = getActiveLinks();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Ajoutez des informations pour activer le Hub.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
          linksPreview.appendChild(a);
        });
      }

      const targetUrl = links.length > 0 ? generateTargetURL(links) : window.location.href;

      qrOutput.innerHTML = '';
      new QRCode(qrOutput, {
        text: targetUrl,
        width: 160,
        height: 160,
        colorDark: qrColorDark.value,
        colorLight: qrColorLight.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // Export SVG Vectoriel
    document.getElementById('download-svg').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const imgData = ctx.getImageData(0, 0, size, size);
      
      let pathData = "";
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (imgData.data[(y * size + x) * 4] < 127) {
            pathData += `M${x},${y}h1v1h-1z `;
          }
        }
      }

      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="500" height="500"><rect width="100%" height="100%" fill="${qrColorLight.value}"/><path d="${pathData}" fill="${qrColorDark.value}"/></svg>`;
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qrcode-hub.svg';
      link.click();
    });

    // Export PNG
    document.getElementById('download-png').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = 'qrcode-hub.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Export PDF
    document.getElementById('download-pdf').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const name = profileNameInput.value.trim() || "Mon Hub Pro";

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');
      doc.setFontSize(22);
      doc.setTextColor(248, 250, 252);
      doc.text(name, 105, 40, { align: 'center' });
      
      if(profileTitleInput.value.trim()) {
        doc.setFontSize(12);
        doc.setTextColor(59, 130, 246);
        doc.text(profileTitleInput.value.trim(), 105, 48, { align: 'center' });
      }

      doc.setFontSize(10);
      doc.setTextColor(148, 163, 184);
      doc.text("Scannez ce QR Code pour accéder à mes liens officiels", 105, 58, { align: 'center' });
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', 55, 75, 100, 100);
      doc.save(`QRCode_${name.replace(/\s+/g, '_')}.pdf`);
    });

    // Mode Visiteur (Affiche le Hub final sur Smartphone)
    function checkVisitorMode() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('hub') && params.has('data')) {
        document.body.classList.add('hub-view');
        
        const theme = params.get('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        const hubName = decodeURIComponent(params.get('hub'));
        const hubTitle = params.get('title') ? decodeURIComponent(params.get('title')) : '';
        const hubBio = params.get('bio') ? decodeURIComponent(params.get('bio')) : '';

        const rawData = atob(params.get('data')).split('|');

        let linksHTML = '';
        rawData.forEach(entry => {
          const [platform, url] = entry.split(/:(.+)/);
          const decodedUrl = decodeURIComponent(url);
          if (PLATFORMS[platform]) {
            linksHTML += `
              <a href="${decodedUrl}" target="_blank" class="social-link-item" style="margin-bottom:12px;">
                <i class="${PLATFORMS[platform].icon}"></i> ${PLATFORMS[platform].name}
              </a>`;
          }
        });

        document.getElementById('editor-container').innerHTML = `
          <div class="card hub-card">
            <h1 style="font-size:1.6rem; margin-bottom:4px;">${hubName}</h1>
            ${hubTitle ? `<div style="color:var(--accent-color); font-weight:600; font-size:0.95rem; margin-bottom:10px;">${hubTitle}</div>` : ''}
            ${hubBio ? `<p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:24px; line-height:1.5;">${hubBio}</p>` : ''}
            <div style="text-align:left;">${linksHTML}</div>
          </div>
        `;
        return true;
      }
      return false;
    }

    if (!checkVisitorMode()) {
      socialInputs.forEach(i => i.addEventListener('input', updateApp));
      profileNameInput.addEventListener('input', updateApp);
      profileTitleInput.addEventListener('input', updateApp);
      profileBioInput.addEventListener('input', updateApp);
      qrColorDark.addEventListener('input', updateApp);
      qrColorLight.addEventListener('input', updateApp);
      updateApp();
    }
  </script>
</body>
</html>
