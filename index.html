<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>qrcodephoenix — Studio QR Code & Bio-Link Pro</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* DEFINITION SYSTEME DES THEMES */
    :root[data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: rgba(31, 41, 55, 0.6);
      --accent-color: #f97316;
      --accent-hover: #ea580c;
      --focus-ring: rgba(249, 115, 22, 0.3);
    }

    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --accent-color: #ea580c;
      --accent-hover: #c2410c;
      --focus-ring: rgba(234, 88, 12, 0.2);
    }

    :root[data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(135deg, #0d0221 0%, #0f051d 100%);
      --card-bg: rgba(25, 10, 45, 0.8);
      --card-border: #facc15;
      --text-main: #00f6ff;
      --text-muted: #ff007f;
      --input-bg: rgba(10, 2, 25, 0.85);
      --accent-color: #facc15;
      --accent-hover: #eab308;
      --focus-ring: rgba(250, 204, 21, 0.4);
    }

    :root[data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #4c1d95 0%, #c2410c 100%);
      --card-bg: rgba(88, 28, 135, 0.5);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-main: #fff7ed;
      --text-muted: #fed7aa;
      --input-bg: rgba(67, 20, 96, 0.55);
      --accent-color: #fb923c;
      --accent-hover: #f97316;
      --focus-ring: rgba(251, 146, 60, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f97316 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .container {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      max-width: 1100px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i { color: var(--accent-color); }

    .theme-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .theme-option {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .theme-option.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--focus-ring);
      color: var(--accent-color);
    }

    .preview-mode-toggle {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .toggle-btn.active {
      background: var(--accent-color);
      color: white;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    textarea {
      padding-left: 42px;
      resize: vertical;
      min-height: 65px;
    }

    input[type="text"]:focus, input[type="url"]:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .qr-modern-wrapper {
      background: #ffffff;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.3);
      margin: 16px 0;
      display: inline-block;
    }

    canvas#modern-qr {
      display: block;
      border-radius: 8px;
    }

    .phone-mockup {
      display: none;
      width: 100%;
      max-width: 310px;
      background: var(--input-bg);
      border: 8px solid #1e293b;
      border-radius: 36px;
      padding: 24px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin: 10px auto;
      text-align: center;
    }

    .phone-mockup.active { display: block; }

    .phone-notch {
      width: 100px;
      height: 14px;
      background: #1e293b;
      border-radius: 0 0 10px 10px;
      margin: -24px auto 18px auto;
    }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      word-break: break-word;
    }

    .social-link-item i {
      font-size: 1.1rem;
      margin-right: 12px;
      width: 20px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-png { background: #10b981; }
    .btn-png:hover { background: #059669; }
    .btn-svg { background: #f59e0b; }
    .btn-svg:hover { background: #d97706; }
    .btn-pdf { background: #ef4444; }
    .btn-pdf:hover { background: #dc2626; }

    @media (max-width: 850px) {
      body { padding: 16px 10px; }
      .container { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 20px; }
      .theme-selector { grid-template-columns: repeat(2, 1fr); }
    }

    body.hub-view { padding: 20px 16px; }
    .hub-card {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .app-footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="app-header" id="app-header">
    <div class="brand-logo">
      <i class="fa-solid fa-fire-flame-curved"></i> qrcodephoenix
    </div>
    <div class="brand-subtitle">Générateur de QR Code Moderne & Page Bio-Link Pro</div>
  </header>

  <div class="container" id="editor-container">
    <!-- Panneau de Configuration -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-palette"></i> Style & Thèmes
      </div>

      <div class="theme-selector">
        <div class="theme-option active" data-theme="dark">
          <i class="fa-solid fa-moon"></i> Dark
        </div>
        <div class="theme-option" data-theme="light">
          <i class="fa-solid fa-sun"></i> Light
        </div>
        <div class="theme-option" data-theme="cyberpunk">
          <i class="fa-solid fa-bolt"></i> Cyber
        </div>
        <div class="theme-option" data-theme="sunset">
          <i class="fa-solid fa-volcano"></i> Sunset
        </div>
      </div>

      <div class="card-title">
        <i class="fa-solid fa-id-card"></i> Profil & Informations
      </div>

      <div class="form-group">
        <label for="profile-name">Nom du profil</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Alexandre Pro" placeholder="Votre nom / marque">
        </div>
      </div>

      <div class="form-group">
        <label for="profile-title">Titre / Profession</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-briefcase"></i>
          <input type="text" id="profile-title" value="Développeur & Graphic Designer" placeholder="Ex: Designer & Développeur">
        </div>
      </div>

      <div class="form-group">
        <label for="profile-bio">Brève Description / Bio</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-align-left" style="top: 14px;"></i>
          <textarea id="profile-bio" placeholder="Bienvenue sur mon hub officiel. Retrouvez tous mes réseaux ci-dessous !">Bienvenue sur mon hub officiel. Retrouvez tous mes liens ci-dessous !</textarea>
        </div>
      </div>

      <div class="form-group">
        <label for="input-whatsapp">WhatsApp</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-whatsapp"></i>
          <input type="text" id="input-whatsapp" class="social-input" data-platform="whatsapp" placeholder="Numéro (ex: 221770000000)">
        </div>
      </div>

      <div class="form-group">
        <label for="input-instagram">Instagram</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" id="input-instagram" class="social-input" data-platform="instagram" placeholder="Nom d'utilisateur">
        </div>
      </div>

      <div class="form-group">
        <label for="input-linkedin">LinkedIn</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-linkedin"></i>
          <input type="text" id="input-linkedin" class="social-input" data-platform="linkedin" placeholder="ID / Lien profil">
        </div>
      </div>

      <div class="form-group">
        <label for="input-website">Site Web</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-globe"></i>
          <input type="url" id="input-website" class="social-input" data-platform="website" placeholder="https://votre-site.com">
        </div>
      </div>

      <label style="margin-top: 18px;">Couleurs du QR Code Modernisé</label>
      <div class="color-picker-grid">
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-dark" value="#0f172a">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Points</span>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-light" value="#ffffff">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Fond</span>
        </div>
      </div>
    </div>

    <!-- Panneau de Prévisualisation -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <div class="preview-mode-toggle">
          <button class="toggle-btn active" id="btn-mode-qr" type="button"><i class="fa-solid fa-qrcode"></i> Aperçu QR</button>
          <button class="toggle-btn" id="btn-mode-phone" type="button"><i class="fa-solid fa-mobile-screen"></i> Aperçu Bio-Link</button>
        </div>

        <!-- Mode QR -->
        <div id="view-qr-container">
          <div class="qr-modern-wrapper">
            <canvas id="modern-qr" width="200" height="200"></canvas>
            <div id="raw-qr" style="display:none;"></div>
          </div>
          <p style="font-size:0.8rem; color:var(--text-muted);">Scannez le QR Code pour tester en direct</p>
        </div>

        <!-- Mode Smartphone -->
        <div class="phone-mockup" id="view-phone-container">
          <div class="phone-notch"></div>
          <h4 id="prev-name" style="font-weight:700; font-size:1.1rem;">Alexandre Pro</h4>
          <div id="prev-title" style="color:var(--accent-color); font-size:0.8rem; font-weight:600; margin-top:2px;">Développeur</div>
          <p id="prev-bio" style="font-size:0.75rem; color:var(--text-muted); margin-top:6px; line-height:1.3;">Description...</p>
          <div class="social-links-list" id="links-preview"></div>
        </div>

      <!-- Actions Exporter -->
      <div class="btn-group">
        <button id="download-png" class="btn btn-png" type="button"><i class="fa-solid fa-image"></i> Exporter PNG HD</button>
        <button id="download-svg" class="btn btn-svg" type="button"><i class="fa-solid fa-vector-square"></i> Exporter SVG Vectoriel</button>
        <button id="download-pdf" class="btn btn-pdf" type="button"><i class="fa-solid fa-file-pdf"></i> Exporter PDF HD</button>
      </div>

  <footer class="app-footer">
    Powered by <strong>qrcodephoenix</strong> — Studio Pro
  </footer>

  <script>
    // Configuration des plateformes
    const PLATFORMS = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/", icon: "fa-brands fa-linkedin", name: "LinkedIn" },
      website: { prefix: "", icon: "fa-solid fa-globe", name: "Site Web" }
    };

    // Helper Encodage / Décodage UTF-8 Sécurisé pour Base64 (Empêche les erreurs btoa avec é, è, etc.)
    function utf8ToBase64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => 
        String.fromCharCode('0x' + p1)
      ));
    }

    function base64ToUtf8(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), c => 
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
    }

    // Eléments DOM
    const profileNameInput = document.getElementById('profile-name');
    const profileTitleInput = document.getElementById('profile-title');
    const profileBioInput = document.getElementById('profile-bio');

    const prevName = document.getElementById('prev-name');
    const prevTitle = document.getElementById('prev-title');
    const prevBio = document.getElementById('prev-bio');

    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const rawQrContainer = document.getElementById('raw-qr');
    const modernCanvas = document.getElementById('modern-qr');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');
    const themeOptions = document.querySelectorAll('.theme-option');

    const btnModeQr = document.getElementById('btn-mode-qr');
    const btnModePhone = document.getElementById('btn-mode-phone');
    const viewQrContainer = document.getElementById('view-qr-container');
    const viewPhoneContainer = document.getElementById('view-phone-container');

    let selectedTheme = 'dark';
    let currentQRMatrix = []; // Stockage de la matrice dynamique

    // Toggle Mode Aperçu
    btnModeQr.addEventListener('click', () => {
      btnModeQr.classList.add('active');
      btnModePhone.classList.remove('active');
      viewQrContainer.style.display = 'block';
      viewPhoneContainer.classList.remove('active');
    });

    btnModePhone.addEventListener('click', () => {
      btnModePhone.classList.add('active');
      btnModeQr.classList.remove('active');
      viewQrContainer.style.display = 'none';
      viewPhoneContainer.classList.add('active');
    });

    // Theme Switcher
    themeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        themeOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedTheme = opt.dataset.theme;
        document.documentElement.setAttribute('data-theme', selectedTheme);
        updateApp();
      });
    });

    function getActiveLinks() {
      const active = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website') {
            const clean = val.replace(/^https?:\/\/(www\.)?/, '').replace(/^@/, '');
            url = PLATFORMS[platform].prefix + clean;
          }
          active.push({ platform, url, name: PLATFORMS[platform].name, icon: PLATFORMS[platform].icon });
        }
      });
      return active;
    }

    function generateTargetURL(links) {
      const name = profileNameInput.value.trim() || "qrcodephoenix Hub";
      const title = profileTitleInput.value.trim();
      const bio = profileBioInput.value.trim();
      
      const payload = links.map(l => `${l.platform}:${l.url}`).join('|');
      const baseUrl = window.location.origin + window.location.pathname;
      
      return `${baseUrl}?hub=${encodeURIComponent(name)}&title=${encodeURIComponent(title)}&bio=${encodeURIComponent(bio)}&theme=${selectedTheme}&data=${utf8ToBase64(payload)}`;
    }

    // Moteur Dynamique de Rendu QR Code (Dots Modernes + Détection dynamique de matrice)
    function renderModernQR(text) {
      rawQrContainer.innerHTML = '';
      
      // Génération initiale par la bibliothèque
      new QRCode(rawQrContainer, {
        text: text,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const sourceCanvas = rawQrContainer.querySelector('canvas');
        if (!sourceCanvas) return;

        const srcCtx = sourceCanvas.getContext('2d');
        const size = 200;
        modernCanvas.width = size;
        modernCanvas.height = size;

        const ctx = modernCanvas.getContext('2d');
        const imgData = srcCtx.getImageData(0, 0, size, size);

        // Algorithme d'analyse : Détection dynamique de la taille de grille du QR Code
        let firstBlackPixelWidth = 0;
        for (let x = 0; x < size; x++) {
          if (imgData.data[x * 4] < 127) {
            firstBlackPixelWidth++;
          } else if (firstBlackPixelWidth > 0) {
            break;
          }
        }
        
        // Le Finder Pattern supérieur gauche mesure exactement 7 modules de large
        const calculatedModuleSize = firstBlackPixelWidth / 7;
        const moduleCount = Math.round(size / calculatedModuleSize);
        const cellSize = size / moduleCount;

        currentQRMatrix = []; // Reconstruire la matrice pour l'export SVG

        // Rendu du fond
        ctx.fillStyle = qrColorLight.value;
        ctx.fillRect(0, 0, size, size);

        ctx.fillStyle = qrColorDark.value;

        // Dessin des modules en version arrondie (Dots)
        for (let row = 0; row < moduleCount; row++) {
          const matrixRow = [];
          for (let col = 0; col < moduleCount; col++) {
            const sampleX = Math.floor(col * cellSize + cellSize / 2);
            const sampleY = Math.floor(row * cellSize + cellSize / 2);
            const pixelIndex = (sampleY * size + sampleX) * 4;
            const isDark = imgData.data[pixelIndex] < 127;

            matrixRow.push(isDark ? 1 : 0);

            if (isDark) {
              const cx = col * cellSize + cellSize / 2;
              const cy = row * cellSize + cellSize / 2;
              const radius = cellSize / 2.3;

              ctx.beginPath();
              ctx.arc(cx, cy, radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          currentQRMatrix.push(matrixRow);
        }
      }, 40);
    }

    function updateApp() {
      prevName.textContent = profileNameInput.value.trim() || "Alexandre Pro";
      prevTitle.textContent = profileTitleInput.value.trim();
      prevBio.textContent = profileBioInput.value.trim();

      prevTitle.style.display = profileTitleInput.value.trim() ? "block" : "none";
      prevBio.style.display = profileBioInput.value.trim() ? "block" : "none";

      const links = getActiveLinks();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.75rem;">Ajoutez des informations pour activer le Hub.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
          linksPreview.appendChild(a);
        });
      }

      const targetUrl = links.length > 0 ? generateTargetURL(links) : window.location.href;
      renderModernQR(targetUrl);
    }

    // Export SVG Vectoriel Propre (<circle> pur)
    document.getElementById('download-svg').addEventListener('click', () => {
      if (!currentQRMatrix || currentQRMatrix.length === 0) return;

      const moduleCount = currentQRMatrix.length;
      const svgSize = 500;
      const cellSize = svgSize / moduleCount;
      const radius = cellSize / 2.3;

      let circlesSVG = "";
      for (let r = 0; r < moduleCount; r++) {
        for (let c = 0; c < moduleCount; c++) {
          if (currentQRMatrix[r][c] === 1) {
            const cx = (c * cellSize + cellSize / 2).toFixed(2);
            const cy = (r * cellSize + cellSize / 2).toFixed(2);
            circlesSVG += `<circle cx="${cx}" cy="${cy}" r="${radius.toFixed(2)}" fill="${qrColorDark.value}"/>`;
          }
        }
      }

      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgSize} ${svgSize}" width="${svgSize}" height="${svgSize}"><rect width="100%" height="100%" fill="${qrColorLight.value}"/>${circlesSVG}</svg>`;
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qrcodephoenix.svg';
      link.click();
    });

    // Export PNG
    document.getElementById('download-png').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'qrcodephoenix.png';
      link.href = modernCanvas.toDataURL('image/png');
      link.click();
    });

    // Export PDF
    document.getElementById('download-pdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const name = profileNameInput.value.trim() || "qrcodephoenix Hub";

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');
      
      doc.setFontSize(26);
      doc.setTextColor(249, 115, 22);
      doc.text("qrcodephoenix", 105, 35, { align: 'center' });

      doc.setFontSize(18);
      doc.setTextColor(248, 250, 252);
      doc.text(name, 105, 48, { align: 'center' });
      
      if(profileTitleInput.value.trim()) {
        doc.setFontSize(11);
        doc.setTextColor(148, 163, 184);
        doc.text(profileTitleInput.value.trim(), 105, 55, { align: 'center' });
      }

      doc.addImage(modernCanvas.toDataURL('image/png'), 'PNG', 55, 75, 100, 100);
      
      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text("Scannez pour ouvrir le hub mobile officiel", 105, 185, { align: 'center' });

      doc.save(`QRCodePhoenix_${name.replace(/\s+/g, '_')}.pdf`);
    });

    // Mode Visiteur (Quand un smartphone scanne le QR Code)
    function checkVisitorMode() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('hub') && params.has('data')) {
        document.body.classList.add('hub-view');
        document.getElementById('app-header').style.display = 'none';
        
        const theme = params.get('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        try {
          const hubName = decodeURIComponent(params.get('hub'));
          const hubTitle = params.get('title') ? decodeURIComponent(params.get('title')) : '';
          const hubBio = params.get('bio') ? decodeURIComponent(params.get('bio')) : '';

          const rawData = base64ToUtf8(params.get('data')).split('|');

          let linksHTML = '';
          rawData.forEach(entry => {
            const separatorIndex = entry.indexOf(':');
            if (separatorIndex !== -1) {
              const platform = entry.substring(0, separatorIndex);
              const url = entry.substring(separatorIndex + 1);
              
              if (PLATFORMS[platform]) {
                linksHTML += `
                  <a href="${url}" target="_blank" rel="noopener noreferrer" class="social-link-item" style="margin-bottom:12px;">
                    <i class="${PLATFORMS[platform].icon}"></i> ${PLATFORMS[platform].name}
                  </a>`;
              }
            }
          });

          document.getElementById('editor-container').innerHTML = `
            <div class="card hub-card">
              <div class="brand-logo" style="font-size:1.2rem; margin-bottom:12px;">
                <i class="fa-solid fa-fire-flame-curved"></i> qrcodephoenix
              </div>
              <h1 style="font-size:1.6rem; margin-bottom:4px;">${hubName}</h1>
              ${hubTitle ? `<div style="color:var(--accent-color); font-weight:600; font-size:0.95rem; margin-bottom:10px;">${hubTitle}</div>` : ''}
              ${hubBio ? `<p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:24px; line-height:1.5;">${hubBio}</p>` : ''}
              <div style="text-align:left;">${linksHTML}</div>
            </div>
          `;
          return true;
        } catch (e) {
          console.error("Erreur de lecture du hub :", e);
        }
      }
      return false;
    }

    // Initialisation
    if (!checkVisitorMode()) {
      socialInputs.forEach(i => i.addEventListener('input', updateApp));
      profileNameInput.addEventListener('input', updateApp);
      profileTitleInput.addEventListener('input', updateApp);
      profileBioInput.addEventListener('input', updateApp);
      qrColorDark.addEventListener('input', updateApp);
      qrColorLight.addEventListener('input', updateApp);
      updateApp();
    }
  </script>
</body>
</html>
