<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQR — Générateur Universal & Réseaux</title>

  <!-- Moteur QR & PDF -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --bg-dark: #030712;
      --panel-bg: rgba(15, 23, 42, 0.7);
      --border-glow: rgba(0, 243, 255, 0.25);
      --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 243, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(255, 0, 85, 0.08) 0px, transparent 50%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: #f3f4f6;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .cyber-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      width: 100%;
      max-width: 1150px;
      padding: 35px;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 35px;
    }

    @media (max-width: 950px) {
      .cyber-card { grid-template-columns: 1fr; padding: 20px; }
    }

    .title-zone {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 5px;
    }

    .title-zone h1 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: var(--text-glow);
    }

    .title-zone p { color: #9ca3af; font-size: 1rem; }

    .control-group { margin-bottom: 18px; }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 1.05rem;
      outline: none;
      transition: all 0.3s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Grille des Réseaux Sociaux */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .preset-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #d1d5db;
      font-family: var(--font-title);
      font-size: 0.6rem;
      transition: all 0.25s ease;
    }

    .preset-btn img { width: 20px; height: 20px; }

    .preset-btn:hover, .preset-btn.active {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      transform: translateY(-2px);
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      padding: 4px 10px;
      border-radius: 8px;
    }

    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    .preview-stage {
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-title);
      font-size: 0.65rem;
      color: var(--neon-cyan);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.2); }
    }

    .qr-holo-frame {
      background: #ffffff;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      transition: all 0.3s;
    }

    #qr-svg-container { width: 230px; height: 230px; }
    #qr-svg-container svg { width: 100%; height: 100%; }

    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-family: var(--font-title);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-cyber-primary {
      background: linear-gradient(90deg, #00f3ff, #0066ff);
      color: #000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    .btn-cyber-primary:hover {
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
      transform: translateY(-2px);
    }

    .btn-row { display: flex; gap: 8px; width: 100%; }
    .btn-row .btn { flex: 1; }

    .btn-cyber-outline {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .btn-cyber-outline:hover {
      background: rgba(0, 243, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="cyber-card">
    <div class="title-zone">
      <h1>CyberQR Studio</h1>
      <p>// Générateur Omnicanal & Multi-Réseaux</p>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div class="control-group">
        <label>⚡ Sélectionner un Média / Canal</label>
        <div class="preset-grid">
          <button class="preset-btn active" onclick="selectPreset('email', 'contact@domaine.com', 'https://cdn-icons-png.flaticon.com/512/732/732200.png', 'mailto:')">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email"> Email
          </button>

          <button class="preset-btn" onclick="selectPreset('whatsapp', 'https://wa.me/33600000000', 'https://cdn-icons-png.flaticon.com/512/3670/3670051.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp"> WhatsApp
          </button>

          <button class="preset-btn" onclick="selectPreset('instagram', 'https://instagram.com/votre_profil', 'https://cdn-icons-png.flaticon.com/512/3938/3938036.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3938/3938036.png" alt="Instagram"> Insta
          </button>

          <button class="preset-btn" onclick="selectPreset('linkedin', 'https://linkedin.com/in/votre_profil', 'https://cdn-icons-png.flaticon.com/512/3536/3536505.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"> LinkedIn
          </button>

          <button class="preset-btn" onclick="selectPreset('facebook', 'https://facebook.com/votre_page', 'https://cdn-icons-png.flaticon.com/512/5968/5968764.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook"> Facebook
          </button>

          <button class="preset-btn" onclick="selectPreset('x', 'https://x.com/votre_profil', 'https://cdn-icons-png.flaticon.com/512/5969/5968830.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/5969/5968830.png" alt="X/Twitter"> X / Twitter
          </button>

          <button class="preset-btn" onclick="selectPreset('youtube', 'https://youtube.com/@votre_chaine', 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"> YouTube
          </button>

          <button class="preset-btn" onclick="selectPreset('tiktok', 'https://tiktok.com/@votre_compte', 'https://cdn-icons-png.flaticon.com/512/3046/3046124.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" alt="TikTok"> TikTok
          </button>

          <button class="preset-btn" onclick="selectPreset('telegram', 'https://t.me/votre_nom', 'https://cdn-icons-png.flaticon.com/512/2111/2111646.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram"> Telegram
          </button>

          <button class="preset-btn" onclick="selectPreset('phone', '+33600000000', 'https://cdn-icons-png.flaticon.com/512/126/126509.png', 'tel:')">
            <img src="https://cdn-icons-png.flaticon.com/512/126/126509.png" alt="Phone"> Téléphone
          </button>
        </div>
      </div>

      <div class="control-group">
        <label for="qr-text" id="input-label">🔗 Adresse Email Cible</label>
        <input type="text" id="qr-text" value="contact@domaine.com" placeholder="Entrez le lien ou la donnée">
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="module-style">📐 Style Modules</label>
          <select id="module-style">
            <option value="dots">Dots (Arrondis)</option>
            <option value="smooth">Gouttes (Smooth)</option>
            <option value="square">Matrice Brut</option>
          </select>
        </div>
        <div>
          <label for="eye-style">👁️ Cadran Yeux</label>
          <select id="eye-style">
            <option value="rounded">Cyber Rounded</option>
            <option value="circle">Orbital Circle</option>
            <option value="square">Square Tech</option>
          </select>
        </div>
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="qr-color">🎨 Couleur Code</label>
          <div class="color-input-wrapper">
            <input type="color" id="qr-color" value="#00f3ff">
            <span style="font-size:0.85rem; color:#aaa;">Couleur Néon</span>
          </div>
        </div>
        <div>
          <label for="bg-color">⬛ Background</label>
          <div class="color-input-wrapper">
            <input type="color" id="bg-color" value="#0a0f1d">
            <span style="font-size:0.85rem; color:#aaa;">Arrière-plan</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label for="logo-url">🛡️ Logo Central (URL)</label>
        <input type="text" id="logo-url" value="https://cdn-icons-png.flaticon.com/512/732/732200.png">
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-stage">
      <div class="status-badge">
        <div class="status-dot"></div>
        SYSTEM ACTIVE
      </div>

      <div class="qr-holo-frame" id="qr-frame">
        <div id="qr-svg-container"></div>
      </div>

      <div class="action-stack">
        <button class="btn btn-cyber-primary" id="dl-png">💾 Exporter PNG HD</button>
        <div class="btn-row">
          <button class="btn btn-cyber-outline" id="dl-svg">Vector SVG</button>
          <button class="btn btn-cyber-outline" id="dl-pdf">Document PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf || {};
    let currentPrefix = 'mailto:';

    class CyberQREngine {
      static generateSVGString(text, options) {
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const count = qr.getModuleCount();
        const size = 500;
        const cellSize = size / count;

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
        svg += `<rect width="100%" height="100%" fill="${options.bgColor}"/>`;

        // Draw Modules
        svg += `<g fill="${options.color}">`;
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if ((r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7)) continue;

            if (qr.isDark(r, c)) {
              const x = c * cellSize;
              const y = r * cellSize;

              if (options.moduleStyle === 'dots') {
                const cx = x + cellSize / 2;
                const cy = y + cellSize / 2;
                svg += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(cellSize / 2.3).toFixed(2)}"/>`;
              } else if (options.moduleStyle === 'smooth') {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}" rx="${(cellSize / 2).toFixed(2)}"/>`;
              } else {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}"/>`;
              }
            }
          }
        }
        svg += `</g>`;

        // Draw Eyes
        const renderEye = (x, y) => {
          const eyeSize = 7 * cellSize;
          const innerSize = eyeSize - (2 * cellSize);

          if (options.eyeStyle === 'circle') {
            const center = x + eyeSize / 2;
            const centerY = y + eyeSize / 2;
            return `
              <g>
                <circle cx="${center}" cy="${centerY}" r="${eyeSize / 2}" fill="${options.color}"/>
                <circle cx="${center}" cy="${centerY}" r="${innerSize / 2}" fill="${options.bgColor}"/>
                <circle cx="${center}" cy="${centerY}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else if (options.eyeStyle === 'rounded') {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" rx="${cellSize * 2}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" rx="${cellSize}" fill="${options.bgColor}"/>
                <circle cx="${x + eyeSize/2}" cy="${y + eyeSize/2}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" fill="${options.bgColor}"/>
                <rect x="${x + 2*cellSize}" y="${y + 2*cellSize}" width="${3*cellSize}" height="${3*cellSize}" fill="${options.color}"/>
              </g>`;
          }
        };

        svg += renderEye(0, 0);
        svg += renderEye((count - 7) * cellSize, 0);
        svg += renderEye(0, (count - 7) * cellSize);

        // Overlay Logo
        if (options.logoUrl) {
          const logoSize = size * 0.22;
          const center = (size - logoSize) / 2;
          svg += `
            <rect x="${center - 6}" y="${center - 6}" width="${logoSize + 12}" height="${logoSize + 12}" fill="${options.bgColor}" rx="12"/>
            <image href="${options.logoUrl}" x="${center}" y="${center}" width="${logoSize}" height="${logoSize}"/>`;
        }

        svg += `</svg>`;
        return svg;
      }
    }

    function getOptions() {
      let rawText = document.getElementById('qr-text').value.trim();
      if (currentPrefix && !rawText.startsWith(currentPrefix) && !rawText.startsWith('http')) {
        rawText = currentPrefix + rawText;
      }

      return {
        text: rawText || 'https://mamadounia.github.io/generateur-qr/',
        color: document.getElementById('qr-color').value,
        bgColor: document.getElementById('bg-color').value,
        moduleStyle: document.getElementById('module-style').value,
        eyeStyle: document.getElementById('eye-style').value,
        logoUrl: document.getElementById('logo-url').value.trim()
      };
    }

    function renderUI() {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      document.getElementById('qr-svg-container').innerHTML = svgString;
      document.getElementById('qr-frame').style.boxShadow = `0 0 30px ${options.color}66`;
    }

    function selectPreset(type, defaultValue, logo, prefix = '') {
      currentPrefix = prefix;
      document.getElementById('qr-text').value = defaultValue;
      document.getElementById('logo-url').value = logo;
      
      const label = document.getElementById('input-label');
      label.innerText = `🔗 ${type.toUpperCase()} CIBLE`;

      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');

      renderUI();
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement('a');
      const file = new Blob([content], { type: contentType });
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById('dl-png').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      const img = new Image();
      
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1000, 1000);
        
        const a = document.createElement('a');
        a.download = 'cyber-qr.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    document.getElementById('dl-svg').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      downloadFile(svgString, 'cyber-qr.svg', 'image/svg+xml');
    });

    document.getElementById('dl-pdf').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 800, 800);

        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.setTextColor(0, 243, 255);
        doc.text('CyberQR Omnichannel Export', 105, 25, { align: 'center' });

        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(150);
        doc.text(`Target : ${options.text}`, 105, 34, { align: 'center' });

        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 55, 45, 100, 100);
        doc.save('cyber-qr.pdf');
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    ['qr-text', 'module-style', 'eye-style', 'qr-color', 'bg-color', 'logo-url'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderUI);
    });

    window.onload = renderUI;
  </script>
</body>
</html>
