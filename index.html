<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Multi-Réseaux & QR Code Studio Pro v3</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* THÈMES AVANCÉS */
    :root[data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --accent-color: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --focus-ring: rgba(59, 130, 246, 0.4);
    }

    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --accent-color: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    :root[data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(135deg, #05050a 0%, #1a0b2e 100%);
      --card-bg: rgba(20, 10, 35, 0.85);
      --card-border: #facc15;
      --accent-gradient: linear-gradient(135deg, #facc15 0%, #a855f7 100%);
      --accent-color: #facc15;
      --text-main: #f3e8ff;
      --text-muted: #c084fc;
      --input-bg: rgba(10, 5, 20, 0.8);
      --focus-ring: rgba(250, 204, 21, 0.5);
    }

    :root[data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #2e1065 0%, #7c2d12 100%);
      --card-bg: rgba(88, 28, 135, 0.4);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
      --accent-color: #f97316;
      --text-main: #fff7ed;
      --text-muted: #fdba74;
      --input-bg: rgba(46, 16, 101, 0.5);
      --focus-ring: rgba(249, 115, 22, 0.4);
    }

    /* VARIABLES DE BORDURES (DYNAMIQUES) */
    :root[data-radius="rounded"] { --btn-radius: 12px; --avatar-radius: 50%; }
    :root[data-radius="pill"] { --btn-radius: 30px; --avatar-radius: 50%; }
    :root[data-radius="sharp"] { --btn-radius: 2px; --avatar-radius: 4px; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      max-width: 1140px;
      width: 100%;
    }

    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-grid, .radius-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .selector-btn {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .selector-btn.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    textarea {
      padding-left: 14px;
      resize: vertical;
      min-height: 60px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 10px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

    /* Preview Card */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .preview-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    /* Rendering dynamic links */
    .avatar-preview {
      width: 70px;
      height: 70px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      margin-bottom: 10px;
      border: 2px solid var(--accent-color);
    }

    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.3);
      margin: 10px 0 16px 0;
    }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--btn-radius);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .social-link-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .social-link-item i {
      font-size: 1.1rem;
      margin-right: 12px;
      width: 20px;
      text-align: center;
    }

    /* Buttons Group */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 11px;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-png { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-svg { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .btn-pdf { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }

    /* Visitor Mode */
    body.hub-view { padding: 20px; }
    .hub-card {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>
<body data-theme="dark" data-radius="rounded">

  <div class="container" id="editor-container">
    <!-- Config Panel -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Direction Artistique
      </div>

      <label>Thème Global</label>
      <div class="theme-grid">
        <button class="selector-btn theme-btn active" data-set-theme="dark"><i class="fa-solid fa-moon"></i> Dark</button>
        <button class="selector-btn theme-btn" data-set-theme="light"><i class="fa-solid fa-sun"></i> Light</button>
        <button class="selector-btn theme-btn" data-set-theme="cyberpunk"><i class="fa-solid fa-bolt"></i> Cyber</button>
        <button class="selector-btn theme-btn" data-set-theme="sunset"><i class="fa-solid fa-volcano"></i> Sunset</button>
      </div>

      <label>Style des Boutons</label>
      <div class="radius-grid">
        <button class="selector-btn radius-btn active" data-set-radius="rounded">Arrondi</button>
        <button class="selector-btn radius-btn" data-set-radius="pill">Pilule</button>
        <button class="selector-btn radius-btn" data-set-radius="sharp">Carré</button>
      </div>

      <div class="card-title" style="margin-top: 24px;">
        <i class="fa-solid fa-id-card"></i> Profil & Identité
      </div>

      <div class="form-group">
        <label>Nom / Marque</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Mon Hub Pro" placeholder="Votre nom">
        </div>
      </div>

      <div class="form-group">
        <label>Biographie Courte</label>
        <textarea id="profile-bio" placeholder="Créateur de contenu / Designer..."></textarea>
      </div>

      <div class="form-group">
        <label>URL Photo de profil (Optionnel)</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-image"></i>
          <input type="url" id="profile-avatar" placeholder="https://exemple.com/avatar.jpg">
        </div>
      </div>

      <div class="card-title" style="margin-top: 24px;">
        <i class="fa-solid fa-link"></i> Réseaux & Liens
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <div class="input-with-icon"><i class="fa-brands fa-whatsapp"></i><input type="text" class="social-input" data-platform="whatsapp" placeholder="Ex: 221770000000"></div>
      </div>
      <div class="form-group">
        <label>Instagram</label>
        <div class="input-with-icon"><i class="fa-brands fa-instagram"></i><input type="text" class="social-input" data-platform="instagram" placeholder="Ex: pseudo"></div>
      </div>
      <div class="form-group">
        <label>LinkedIn</label>
        <div class="input-with-icon"><i class="fa-brands fa-linkedin"></i><input type="text" class="social-input" data-platform="linkedin" placeholder="Ex: in/profil"></div>
      </div>
      <div class="form-group">
        <label>TikTok</label>
        <div class="input-with-icon"><i class="fa-brands fa-tiktok"></i><input type="text" class="social-input" data-platform="tiktok" placeholder="Ex: @pseudo"></div>
      </div>
      <div class="form-group">
        <label>Site Web</label>
        <div class="input-with-icon"><i class="fa-solid fa-globe"></i><input type="url" class="social-input" data-platform="website" placeholder="https://site.com"></div>
      </div>

      <label style="margin-top: 16px;">Couleurs du QR Code</label>
      <div class="color-picker-grid">
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-dark" value="#0f172a">
          <span style="font-size: 0.75rem; color: var(--text-muted);">Modules</span>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-light" value="#ffffff">
          <span style="font-size: 0.75rem; color: var(--text-muted);">Arrière-plan</span>
        </div>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <span class="preview-badge"><i class="fa-solid fa-eye"></i> Aperçu Temps Réel</span>
        
        <div id="avatar-container"></div>
        <h3 id="preview-name-display" style="font-size: 1.2rem; margin-bottom: 4px;">Mon Hub Pro</h3>
        <p id="preview-bio-display" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;"></p>

        <div class="qr-container">
          <div id="qr-output"></div>
        </div>

        <div class="social-links-list" id="links-preview"></div>
      </div>

      <div class="btn-group">
        <button id="download-png" class="btn btn-png"><i class="fa-solid fa-file-image"></i> Exporter en PNG</button>
        <button id="download-svg" class="btn btn-svg"><i class="fa-solid fa-vector-square"></i> Exporter en SVG Vectoriel</button>
        <button id="download-pdf" class="btn btn-pdf"><i class="fa-solid fa-file-pdf"></i> Exporter la Fiche PDF</button>
      </div>
    </div>
  </div>

  <script>
    const PLATFORMS = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/", icon: "fa-brands fa-linkedin", name: "LinkedIn" },
      tiktok: { prefix: "https://tiktok.com/", icon: "fa-brands fa-tiktok", name: "TikTok" },
      website: { prefix: "", icon: "fa-solid fa-globe", name: "Site Web" }
    };

    // DOM Elements
    const profileNameInput = document.getElementById('profile-name');
    const profileBioInput = document.getElementById('profile-bio');
    const profileAvatarInput = document.getElementById('profile-avatar');
    const previewNameDisplay = document.getElementById('preview-name-display');
    const previewBioDisplay = document.getElementById('preview-bio-display');
    const avatarContainer = document.getElementById('avatar-container');
    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const qrOutput = document.getElementById('qr-output');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');

    let currentTheme = 'dark';
    let currentRadius = 'rounded';

    // Event Listeners Selectors
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTheme = btn.dataset.setTheme;
        document.body.setAttribute('data-theme', currentTheme);
        updateApp();
      });
    });

    document.querySelectorAll('.radius-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.radius-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRadius = btn.dataset.setRadius;
        document.body.setAttribute('data-radius', currentRadius);
        updateApp();
      });
    });

    function getActiveLinks() {
      const active = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website') {
            const clean = val.replace(/^https?:\/\/(www\.)?/, '').replace(/^@/, '');
            url = PLATFORMS[platform].prefix + clean;
          }
          active.push({ platform, url, name: PLATFORMS[platform].name, icon: PLATFORMS[platform].icon });
        }
      });
      return active;
    }

    function generateTargetURL(links) {
      const name = encodeURIComponent(profileNameInput.value.trim() || "Mon Hub Pro");
      const bio = encodeURIComponent(profileBioInput.value.trim());
      const avatar = encodeURIComponent(profileAvatarInput.value.trim());
      const payload = links.map(l => `${l.platform}:${encodeURIComponent(l.url)}`).join('|');
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?hub=${name}&bio=${bio}&avatar=${avatar}&theme=${currentTheme}&radius=${currentRadius}&data=${btoa(payload)}`;
    }

    function updateApp() {
      // Direct Text Updates
      const nameVal = profileNameInput.value.trim() || "Mon Hub Pro";
      const bioVal = profileBioInput.value.trim();
      const avatarVal = profileAvatarInput.value.trim();

      previewNameDisplay.textContent = nameVal;
      previewBioDisplay.textContent = bioVal;

      if (avatarVal) {
        avatarContainer.innerHTML = `<img src="${avatarVal}" class="avatar-preview" alt="Avatar" onerror="this.style.display='none'">`;
      } else {
        avatarContainer.innerHTML = '';
      }

      // Dynamic Social Links
      const links = getActiveLinks();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.8rem;">Remplissez vos réseaux pour générer les boutons.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
          linksPreview.appendChild(a);
        });
      }

      // Generate QR Code
      const targetUrl = links.length > 0 ? generateTargetURL(links) : window.location.href;
      qrOutput.innerHTML = '';
      new QRCode(qrOutput, {
        text: targetUrl,
        width: 170,
        height: 170,
        colorDark: qrColorDark.value,
        colorLight: qrColorLight.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // EXPORTS (PNG, SVG, PDF)
    document.getElementById('download-png').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = 'qrcode-hub.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('download-svg').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const imgData = ctx.getImageData(0, 0, size, size);
      
      let pathData = "";
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          if (imgData.data[idx] < 127) pathData += `M${x},${y}h1v1h-1z `;
        }
      }

      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="500" height="500"><rect width="100%" height="100%" fill="${qrColorLight.value}"/><path d="${pathData}" fill="${qrColorDark.value}"/></svg>`;
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qrcode-vector.svg';
      link.click();
    });

    document.getElementById('download-pdf').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const name = profileNameInput.value.trim() || "Mon Hub Pro";

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');
      doc.setFontSize(22);
      doc.setTextColor(248, 250, 252);
      doc.text(name, 105, 40, { align: 'center' });
      doc.setFontSize(10);
      doc.setTextColor(148, 163, 184);
      doc.text("Scannez pour retrouver tous mes liens", 105, 48, { align: 'center' });
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', 55, 65, 100, 100);
      doc.save(`QRCode_${name.replace(/\s+/g, '_')}.pdf`);
    });

    // Check Visitor Mode
    function checkVisitorMode() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('hub') && params.has('data')) {
        document.body.classList.add('hub-view');
        
        const activeTheme = params.get('theme') || 'dark';
        const activeRadius = params.get('radius') || 'rounded';
        document.body.setAttribute('data-theme', activeTheme);
        document.body.setAttribute('data-radius', activeRadius);

        const hubName = decodeURIComponent(params.get('hub'));
        const bio = params.has('bio') ? decodeURIComponent(params.get('bio')) : '';
        const avatar = params.has('avatar') ? decodeURIComponent(params.get('avatar')) : '';
        const rawData = atob(params.get('data')).split('|');

        let linksHTML = '';
        rawData.forEach(entry => {
          const [platform, url] = entry.split(/:(.+)/);
          const decodedUrl = decodeURIComponent(url);
          if (PLATFORMS[platform]) {
            linksHTML += `
              <a href="${decodedUrl}" target="_blank" class="social-link-item" style="margin-bottom:12px;">
                <i class="${PLATFORMS[platform].icon}"></i> ${PLATFORMS[platform].name}
              </a>`;
          }
        });

        const avatarHTML = avatar ? `<img src="${avatar}" class="avatar-preview" style="margin: 0 auto 12px auto; display:block;">` : '';
        const bioHTML = bio ? `<p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">${bio}</p>` : '';

        document.getElementById('editor-container').innerHTML = `
          <div class="card hub-card">
            ${avatarHTML}
            <h1 style="font-size:1.6rem; margin-bottom:6px;">${hubName}</h1>
            ${bioHTML}
            <div style="text-align:left;">${linksHTML}</div>
          </div>
        `;
        return true;
      }
      return false;
    }

    if (!checkVisitorMode()) {
      [profileNameInput, profileBioInput, profileAvatarInput, qrColorDark, qrColorLight].forEach(el => el.addEventListener('input', updateApp));
      socialInputs.forEach(i => i.addEventListener('input', updateApp));
      updateApp();
    }
  </script>
</body>
</html>
