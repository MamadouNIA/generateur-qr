<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur QR Code Pro & Studio Design</title>

  <!-- Dépendances Moteur QR & PDF -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 1050px;
      padding: 36px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .app-card { grid-template-columns: 1fr; padding: 24px; }
    }

    .title {
      grid-column: 1 / -1;
      text-align: center;
    }

    .title h1 { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }
    .title p { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

    .control-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus { border-color: var(--primary); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .social-presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .preset-btn img { width: 22px; height: 22px; }

    .preset-btn:hover, .preset-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
      transform: translateY(-2px);
    }

    /* Conteneur de prévisualisation */
    .preview-stage {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .qr-frame {
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qr-svg-container {
      width: 260px;
      height: 260px;
    }

    #qr-svg-container svg {
      width: 100%;
      height: 100%;
    }

    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn-row .btn { flex: 1; }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-main);
    }

    .btn-outline:hover { background: #f1f5f9; border-color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="title">
      <h1>Générateur de QR Code Modernized</h1>
      <p>Personnalisez les modules, les formes d'yeux et les formats vectoriels</p>
    </div>

    <!-- Panneau de Contrôle -->
    <div class="controls-panel">
      <div class="control-group">
        <label>1. Raccourcis Réseaux</label>
        <div class="social-presets">
          <button class="preset-btn active" onclick="applyPreset('https://mamadounia.github.io/generateur-qr/', 'https://cdn-icons-png.flaticon.com/512/25/25231.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub"> GitHub
          </button>
          <button class="preset-btn" onclick="applyPreset('https://wa.me/33600000000', 'https://cdn-icons-png.flaticon.com/512/3670/3670051.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp"> WhatsApp
          </button>
          <button class="preset-btn" onclick="applyPreset('https://instagram.com/votre_compte', 'https://cdn-icons-png.flaticon.com/512/3938/3938036.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3938/3938036.png" alt="Instagram"> Instagram
          </button>
          <button class="preset-btn" onclick="applyPreset('https://linkedin.com/in/votre_profil', 'https://cdn-icons-png.flaticon.com/512/3536/3536505.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"> LinkedIn
          </button>
        </div>
      </div>

      <div class="control-group">
        <label for="qr-text">2. Contenu ou URL Cible</label>
        <input type="text" id="qr-text" value="https://mamadounia.github.io/generateur-qr/" placeholder="Saisissez une URL">
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="module-style">Style des Modules</label>
          <select id="module-style">
            <option value="dots">Arrondis (Dots)</option>
            <option value="square">Carrés Classiques</option>
            <option value="smooth">Gouttes (Smooth)</option>
          </select>
        </div>
        <div>
          <label for="eye-style">Style des Yeux</label>
          <select id="eye-style">
            <option value="rounded">Coins Arrondis</option>
            <option value="circle">Cercle Concentrique</option>
            <option value="square">Carré Brut</option>
          </select>
        </div>
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="qr-color">Couleur Code</label>
          <input type="color" id="qr-color" value="#1e40af">
        </div>
        <div>
          <label for="bg-color">Couleur Fond</label>
          <input type="color" id="bg-color" value="#ffffff">
        </div>
      </div>

      <div class="control-group">
        <label for="logo-url">Logo Intégré (URL)</label>
        <input type="text" id="logo-url" value="https://cdn-icons-png.flaticon.com/512/25/25231.png">
      </div>
    </div>

    <!-- Zone de Rendu -->
    <div class="preview-stage">
      <div class="qr-frame">
        <div id="qr-svg-container"></div>
      </div>

      <div class="action-stack">
        <button class="btn btn-primary" id="dl-png">Télécharger en PNG HD</button>
        <div class="btn-row">
          <button class="btn btn-outline" id="dl-svg">Vectoriel SVG</button>
          <button class="btn btn-outline" id="dl-pdf">Document PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf || {};

    // --- MOTEUR DE DESSIN VECTORIEL (SVG) ---
    class QRCodeEngine {
      static generateSVGString(text, options) {
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const count = qr.getModuleCount();
        const size = 500;
        const cellSize = size / count;

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
        svg += `<rect width="100%" height="100%" fill="${options.bgColor}"/>`;

        // Dessin des modules
        svg += `<g fill="${options.color}">`;
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            // Ignorer les zones réservées aux yeux (7x7)
            if ((r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7)) continue;

            if (qr.isDark(r, c)) {
              const x = c * cellSize;
              const y = r * cellSize;

              if (options.moduleStyle === 'dots') {
                const cx = x + cellSize / 2;
                const cy = y + cellSize / 2;
                svg += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(cellSize / 2.3).toFixed(2)}"/>`;
              } else if (options.moduleStyle === 'smooth') {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}" rx="${(cellSize / 2).toFixed(2)}"/>`;
              } else {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}"/>`;
              }
            }
          }
        }
        svg += `</g>`;

        // Dessin des Cadrans (Yeux)
        const renderEye = (x, y) => {
          const eyeSize = 7 * cellSize;
          const innerSize = eyeSize - (2 * cellSize);

          if (options.eyeStyle === 'circle') {
            const center = x + eyeSize / 2;
            const centerY = y + eyeSize / 2;
            return `
              <g>
                <circle cx="${center}" cy="${centerY}" r="${eyeSize / 2}" fill="${options.color}"/>
                <circle cx="${center}" cy="${centerY}" r="${innerSize / 2}" fill="${options.bgColor}"/>
                <circle cx="${center}" cy="${centerY}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else if (options.eyeStyle === 'rounded') {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" rx="${cellSize * 2}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" rx="${cellSize}" fill="${options.bgColor}"/>
                <circle cx="${x + eyeSize/2}" cy="${y + eyeSize/2}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" fill="${options.bgColor}"/>
                <rect x="${x + 2*cellSize}" y="${y + 2*cellSize}" width="${3*cellSize}" height="${3*cellSize}" fill="${options.color}"/>
              </g>`;
          }
        };

        svg += renderEye(0, 0);
        svg += renderEye((count - 7) * cellSize, 0);
        svg += renderEye(0, (count - 7) * cellSize);

        // Incrustation du Logo avec masque propre
        if (options.logoUrl) {
          const logoSize = size * 0.22;
          const center = (size - logoSize) / 2;
          svg += `
            <rect x="${center - 6}" y="${center - 6}" width="${logoSize + 12}" height="${logoSize + 12}" fill="${options.bgColor}" rx="12"/>
            <image href="${options.logoUrl}" x="${center}" y="${center}" width="${logoSize}" height="${logoSize}"/>`;
        }

        svg += `</svg>`;
        return svg;
      }
    }

    // --- LOGIQUE I/O ET INTERFACE ---
    function getOptions() {
      return {
        text: document.getElementById('qr-text').value.trim() || 'https://mamadounia.github.io/generateur-qr/',
        color: document.getElementById('qr-color').value,
        bgColor: document.getElementById('bg-color').value,
        moduleStyle: document.getElementById('module-style').value,
        eyeStyle: document.getElementById('eye-style').value,
        logoUrl: document.getElementById('logo-url').value.trim()
      };
    }

    function renderUI() {
      const options = getOptions();
      const svgString = QRCodeEngine.generateSVGString(options.text, options);
      document.getElementById('qr-svg-container').innerHTML = svgString;
    }

    function applyPreset(url, logo) {
      document.getElementById('qr-text').value = url;
      document.getElementById('logo-url').value = logo;
      
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');

      renderUI();
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement('a');
      const file = new Blob([content], { type: contentType });
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Export PNG HD via Canvas conversion
    document.getElementById('dl-png').addEventListener('click', () => {
      const options = getOptions();
      const svgString = QRCodeEngine.generateSVGString(options.text, options);
      const img = new Image();
      
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1000, 1000);
        
        const a = document.createElement('a');
        a.download = 'qrcode.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    // Export SVG
    document.getElementById('dl-svg').addEventListener('click', () => {
      const options = getOptions();
      const svgString = QRCodeEngine.generateSVGString(options.text, options);
      downloadFile(svgString, 'qrcode.svg', 'image/svg+xml');
    });

    // Export PDF Document
    document.getElementById('dl-pdf').addEventListener('click', () => {
      const options = getOptions();
      const svgString = QRCodeEngine.generateSVGString(options.text, options);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 800, 800);

        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.setTextColor(30, 64, 175);
        doc.text('Fiche QR Code Vectoriel', 105, 25, { align: 'center' });

        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(100);
        doc.text(`Cible : ${options.text}`, 105, 34, { align: 'center' });

        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 55, 45, 100, 100);

        doc.setFontSize(9);
        doc.text('Généré via GitHub Pages Engine', 105, 160, { align: 'center' });
        doc.save('qrcode-export.pdf');
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    // Événements dynamiques de modification
    ['qr-text', 'module-style', 'eye-style', 'qr-color', 'bg-color', 'logo-url'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderUI);
    });

    // Lancement au chargement
    window.onload = renderUI;
  </script>
</body>
</html>
