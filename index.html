<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affichage QR Code Optimisé</title>
  <style>
    /* ==========================================================================
       1. RÉINITIALISATION ET STYLES DE BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a; /* Fond sombre moderne pour un contraste optimal */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    /* ==========================================================================
       2. CONTENEUR DU QR CODE (Quiet Zone & Rendu)
       ========================================================================== */
    .qr-card {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 340px;
      width: 100%;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .qr-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.4);
    }

    /* Cadre de sécurité interne pour préserver la Quiet Zone */
    .qr-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #ffffff;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Rendering anticrénelage dur pour garantir la netteté pixel-perfect */
    .qr-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      
      /* Forcer le rendu net sans flou de redimensionnement */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* ==========================================================================
       3. TEXTE ET DÉTAILS TYPOGRAPHIQUES
       ========================================================================== */
    .qr-title {
      margin-top: 20px;
      font-size: 1.125rem;
      font-weight: 700;
      color: #0f172a;
    }

    .qr-subtitle {
      margin-top: 6px;
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Carte d'affichage du QR Code -->
  <main class="qr-card">
    <div class="qr-wrapper">
      <img 
        class="qr-image" 
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQAQMAAAC63O36AAAABlBMVEUAAAD///+l2Z/dAAAACXBIWXMAAAsTAAALEwEAmpwYAAABy0lEQVR42u3dQY7bMAxGUej9D91ug91pC4xsyYpS13+pG2S1Jm4iO/D4EaC3E0mSJE38C7wA/oOQ4J/AC0CS3vR42m4/vQG3E3ACJE2yA3A/vwC33e8AtxO3A2+HJE1y/I0/vwHAn/sPAAAAAElFTkSuQmCC" 
        alt="QR Code d'accès"
        width="300"
        height="300"
        loading="eager"
        decoding="sync"
      />
    </div>
    <h1 class="qr-title">Scannez le QR Code</h1>
    <p class="qr-subtitle">Pointez l'appareil photo de votre smartphone pour accéder directement au contenu.</p>
  </main>

</body>
</html>
