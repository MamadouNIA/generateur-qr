<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Multi-Réseaux & QR Code Studio Pro</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --focus-ring: rgba(59, 130, 246, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      max-width: 1080px;
      width: 100%;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-title i {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 1rem;
      transition: color 0.3s;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus, input[type="url"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px var(--focus-ring);
      background: rgba(15, 23, 42, 0.85);
    }

    .input-with-icon:focus-within i { color: #3b82f6; }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

    /* Preview Section */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .preview-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: inline-block;
      margin-bottom: 20px;
    }

    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
      margin: 10px 0 20px 0;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .qr-container:hover { transform: scale(1.02); }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .social-links-list::-webkit-scrollbar { width: 4px; }
    .social-links-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .social-link-item:hover {
      transform: translateY(-2px);
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(30, 41, 59, 0.9);
    }

    .social-link-item i {
      font-size: 1.1rem;
      margin-right: 12px;
      width: 20px;
      text-align: center;
    }

    /* Brand Colors */
    .fa-whatsapp { color: #25D366; }
    .fa-instagram { color: #E4405F; }
    .fa-linkedin { color: #0A66C2; }
    .fa-facebook { color: #1877F2; }
    .fa-tiktok { color: #00f2fe; }
    .fa-x-twitter { color: #ffffff; }
    .fa-globe { color: #3b82f6; }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 13px;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-png { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-svg { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .btn-pdf { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }

    /* Landing Mode pour les visiteurs du QR Code */
    body.hub-view {
      padding: 20px;
    }
    .hub-card {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Mode Éditeur -->
  <div class="container" id="editor-container">
    <!-- Configuration -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-sliders"></i> Configuration Hub
      </div>

      <div class="form-group">
        <label>Nom ou Marque</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Mon Hub Pro" placeholder="Ex: Jean Dupont">
        </div>
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-whatsapp"></i>
          <input type="text" class="social-input" data-platform="whatsapp" placeholder="Ex: 221770000000">
        </div>
      </div>

      <div class="form-group">
        <label>Instagram</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" class="social-input" data-platform="instagram" placeholder="Ex: pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>LinkedIn</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-linkedin"></i>
          <input type="text" class="social-input" data-platform="linkedin" placeholder="Ex: in/profil">
        </div>
      </div>

      <div class="form-group">
        <label>TikTok</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-tiktok"></i>
          <input type="text" class="social-input" data-platform="tiktok" placeholder="Ex: @pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>Facebook</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-facebook"></i>
          <input type="text" class="social-input" data-platform="facebook" placeholder="Ex: page">
        </div>
      </div>

      <div class="form-group">
        <label>X (Twitter)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-x-twitter"></i>
          <input type="text" class="social-input" data-platform="x" placeholder="Ex: pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>Site Web</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-globe"></i>
          <input type="url" class="social-input" data-platform="website" placeholder="https://exemple.com">
        </div>
      </div>

      <label style="margin-top: 20px;">Style QR Code</label>
      <div class="color-picker-grid">
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-dark" value="#0f172a">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Code</span>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="qr-color-light" value="#ffffff">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Fond</span>
        </div>
      </div>
    </div>

    <!-- Aperçu & Exports -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <span class="preview-badge"><i class="fa-solid fa-bolt"></i> Rendu Temps Réel</span>
        
        <div class="qr-container">
          <div id="qr-output"></div>
        </div>

        <div class="social-links-list" id="links-preview"></div>
      </div>

      <div class="btn-group">
        <button id="download-png" class="btn btn-png"><i class="fa-solid fa-file-image"></i> Télécharger PNG</button>
        <button id="download-svg" class="btn btn-svg"><i class="fa-solid fa-vector-square"></i> Télécharger SVG (Vectoriel)</button>
        <button id="download-pdf" class="btn btn-pdf"><i class="fa-solid fa-file-pdf"></i> Télécharger PDF (HD)</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration des plateformes
    const PLATFORMS = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/", icon: "fa-brands fa-linkedin", name: "LinkedIn" },
      tiktok: { prefix: "https://tiktok.com/", icon: "fa-brands fa-tiktok", name: "TikTok" },
      facebook: { prefix: "https://facebook.com/", icon: "fa-brands fa-facebook", name: "Facebook" },
      x: { prefix: "https://x.com/", icon: "fa-brands fa-x-twitter", name: "X (Twitter)" },
      website: { prefix: "", icon: "fa-solid fa-globe", name: "Site Web" }
    };

    // DOM Elements
    const profileNameInput = document.getElementById('profile-name');
    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const qrOutput = document.getElementById('qr-output');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');

    let qrInstance = null;

    // Récupérer la liste des liens renseignés
    function getActiveLinks() {
      const active = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website') {
            const clean = val.replace(/^https?:\/\/(www\.)?/, '').replace(/^@/, '');
            url = PLATFORMS[platform].prefix + clean;
          }
          active.push({
            platform,
            url,
            name: PLATFORMS[platform].name,
            icon: PLATFORMS[platform].icon
          });
        }
      });
      return active;
    }

    // Encoder la configuration dans l'URL pour le QR Code
    function generateTargetURL(links) {
      const name = encodeURIComponent(profileNameInput.value.trim() || "Mon Hub Pro");
      const payload = links.map(l => `${l.platform}:${encodeURIComponent(l.url)}`).join('|');
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?hub=${name}&data=${btoa(payload)}`;
    }

    // Mise à jour temps réel
    function updateApp() {
      const links = getActiveLinks();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Saisissez au moins un réseau social.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
          linksPreview.appendChild(a);
        });
      }

      const targetUrl = links.length > 0 ? generateTargetURL(links) : window.location.href;

      qrOutput.innerHTML = '';
      qrInstance = new QRCode(qrOutput, {
        text: targetUrl,
        width: 180,
        height: 180,
        colorDark: qrColorDark.value,
        colorLight: qrColorLight.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // --- LOGIQUES D'EXPORTATION AVANCÉES ---

    // 1. Export PNG
    document.getElementById('download-png').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;
      
      const link = document.createElement('a');
      link.download = 'qrcode-hub.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 2. Export SVG Vectoriel Pur (Vrai Vectoriel via Path)
    document.getElementById('download-svg').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const imgData = ctx.getImageData(0, 0, size, size);
      
      let pathData = "";
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          // Si le pixel est sombre (code QR)
          if (imgData.data[idx] < 127) {
            pathData += `M${x},${y}h1v1h-1z `;
          }
        }
      }

      const svgContent = `<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="500" height="500">
  <rect width="100%" height="100%" fill="${qrColorLight.value}"/>
  <path d="${pathData}" fill="${qrColorDark.value}"/>
</svg>`;

      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qrcode-vectoriel.svg';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // 3. Export PDF
    document.getElementById('download-pdf').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const name = profileNameInput.value.trim() || "Mon Hub Pro";

      // Design du document
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setFontSize(24);
      doc.setTextColor(248, 250, 252);
      doc.text(name, 105, 45, { align: 'center' });

      doc.setFontSize(11);
      doc.setTextColor(148, 163, 184);
      doc.text("Scannez ce QR Code pour accéder à mes liens professionnels", 105, 55, { align: 'center' });

      // Image QR
      const imgData = canvas.toDataURL('image/png');
      doc.addImage(imgData, 'PNG', 55, 75, 100, 100);

      doc.setFontSize(9);
      doc.text("Généré par Studio QR Code", 105, 270, { align: 'center' });

      doc.save(`QRCode_${name.replace(/\s+/g, '_')}.pdf`);
    });

    // MODE ROUTEUR : Si le QR Code est scanné par un visiteur
    function checkVisitorMode() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('hub') && params.has('data')) {
        document.body.classList.add('hub-view');
        const hubName = decodeURIComponent(params.get('hub'));
        const rawData = atob(params.get('data')).split('|');

        let linksHTML = '';
        rawData.forEach(entry => {
          const [platform, url] = entry.split(/:(.+)/);
          const decodedUrl = decodeURIComponent(url);
          if (PLATFORMS[platform]) {
            linksHTML += `
              <a href="${decodedUrl}" target="_blank" class="social-link-item" style="margin-bottom:10px;">
                <i class="${PLATFORMS[platform].icon}"></i> ${PLATFORMS[platform].name}
              </a>`;
          }
        });

        document.getElementById('editor-container').innerHTML = `
          <div class="card hub-card">
            <h1 style="font-size:1.8rem; margin-bottom:10px;">${hubName}</h1>
            <p style="color:var(--text-muted); margin-bottom:24px; font-size:0.9rem;">Retrouvez tous mes liens officiels ci-dessous</p>
            <div style="text-align:left;">${linksHTML}</div>
          </div>
        `;
        return true;
      }
      return false;
    }

    // Init App
    if (!checkVisitorMode()) {
      socialInputs.forEach(i => i.addEventListener('input', updateApp));
      profileNameInput.addEventListener('input', updateApp);
      qrColorDark.addEventListener('input', updateApp);
      qrColorLight.addEventListener('input', updateApp);
      updateApp();
    }
  </script>
</body>
</html>
