<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQR — Générateur Holographique Studio</title>

  <!-- Dépendances Moteur QR & PDF -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Polices Futuristes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-blue: #3b82f6;
      --bg-dark: #030712;
      --panel-bg: rgba(15, 23, 42, 0.65);
      --border-glow: rgba(0, 243, 255, 0.2);
      --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 243, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(255, 0, 85, 0.08) 0px, transparent 50%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: #f3f4f6;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      overflow-x: hidden;
    }

    /* Carte Principale Glassmorphic */
    .cyber-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
      width: 100%;
      max-width: 1100px;
      padding: 40px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      position: relative;
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-magenta));
      border-radius: 22px;
      z-index: -1;
      opacity: 0.4;
    }

    @media (max-width: 900px) {
      .cyber-card { grid-template-columns: 1fr; padding: 20px; }
    }

    /* En-tête */
    .title-zone {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 10px;
    }

    .title-zone h1 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: var(--text-glow);
    }

    .title-zone p {
      color: #9ca3af;
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Formulaires & Contrôles Futuristes */
    .control-group { margin-bottom: 20px; }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 1.1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Raccourcis Réseaux en Neumorphism / Cyber Style */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #d1d5db;
      font-family: var(--font-title);
      font-size: 0.65rem;
      transition: all 0.3s ease;
    }

    .preset-btn img { width: 22px; height: 22px; filter: drop-shadow(0 0 2px rgba(255,255,255,0.5)); }

    .preset-btn:hover, .preset-btn.active {
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Sélecteur de couleur personnalisé */
    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 8px;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    /* Zone de prévisualisation Holographique */
    .preview-stage {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-title);
      font-size: 0.65rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .qr-holo-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      position: relative;
      transition: all 0.3s ease;
    }

    #qr-svg-container {
      width: 240px;
      height: 240px;
    }

    #qr-svg-container svg { width: 100%; height: 100%; }

    /* Boutons Cyber */
    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-cyber-primary {
      background: linear-gradient(90deg, #00f3ff, #0066ff);
      color: #000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    .btn-cyber-primary:hover {
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
      transform: translateY(-2px);
    }

    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn-row .btn { flex: 1; }

    .btn-cyber-outline {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .btn-cyber-outline:hover {
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="cyber-card">
    <div class="title-zone">
      <h1>CyberQR Studio</h1>
      <p>// Générateur Vectoriel Holographique</p>
    </div>

    <!-- Section Contrôles -->
    <div class="controls-panel">
      <div class="control-group">
        <label>⚡ Réseau Cible</label>
        <div class="preset-grid">
          <button class="preset-btn active" onclick="applyPreset('https://mamadounia.github.io/generateur-qr/', 'https://cdn-icons-png.flaticon.com/512/25/25231.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub"> GITHUB
          </button>
          <button class="preset-btn" onclick="applyPreset('https://wa.me/33600000000', 'https://cdn-icons-png.flaticon.com/512/3670/3670051.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp"> WHATSAPP
          </button>
          <button class="preset-btn" onclick="applyPreset('https://instagram.com/votre_profil', 'https://cdn-icons-png.flaticon.com/512/3938/3938036.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3938/3938036.png" alt="Instagram"> INSTA
          </button>
          <button class="preset-btn" onclick="applyPreset('https://linkedin.com/in/votre_profil', 'https://cdn-icons-png.flaticon.com/512/3536/3536505.png')">
            <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"> LINKEDIN
          </button>
        </div>
      </div>

      <div class="control-group">
        <label for="qr-text">🔗 Contenu / URL Cible</label>
        <input type="text" id="qr-text" value="https://mamadounia.github.io/generateur-qr/" placeholder="Saisissez une adresse Web">
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="module-style">📐 Style Modules</label>
          <select id="module-style">
            <option value="dots">Dots (Arrondis)</option>
            <option value="smooth">Gouttes (Smooth)</option>
            <option value="square">Matrice Brut</option>
          </select>
        </div>
        <div>
          <label for="eye-style">👁️ Cadran Yeux</label>
          <select id="eye-style">
            <option value="rounded">Cyber Rounded</option>
            <option value="circle">Orbital Circle</option>
            <option value="square">Square Tech</option>
          </select>
        </div>
      </div>

      <div class="grid-2 control-group">
        <div>
          <label for="qr-color">🎨 Couleur Code</label>
          <div class="color-input-wrapper">
            <input type="color" id="qr-color" value="#00f3ff">
            <span style="font-size:0.9rem; color:#aaa;">Néon Principal</span>
          </div>
        </div>
        <div>
          <label for="bg-color">⬛ Background</label>
          <div class="color-input-wrapper">
            <input type="color" id="bg-color" value="#0a0f1d">
            <span style="font-size:0.9rem; color:#aaa;">Fond Fondé</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label for="logo-url">🛡️ Logo Central (URL)</label>
        <input type="text" id="logo-url" value="https://cdn-icons-png.flaticon.com/512/25/25231.png">
      </div>
    </div>

    <!-- Section Rendu Holographique -->
    <div class="preview-stage">
      <div class="status-badge">
        <div class="status-dot"></div>
        SYSTEM READY
      </div>

      <div class="qr-holo-frame" id="qr-frame">
        <div id="qr-svg-container"></div>
      </div>

      <div class="action-stack">
        <button class="btn btn-cyber-primary" id="dl-png">💾 Télécharger PNG HD</button>
        <div class="btn-row">
          <button class="btn btn-cyber-outline" id="dl-svg">Vector SVG</button>
          <button class="btn btn-cyber-outline" id="dl-pdf">Doc PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf || {};

    // --- MOTEUR VECTORIEL SVG DE HAUTE PRÉCISION ---
    class CyberQREngine {
      static generateSVGString(text, options) {
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const count = qr.getModuleCount();
        const size = 500;
        const cellSize = size / count;

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
        svg += `<rect width="100%" height="100%" fill="${options.bgColor}"/>`;

        // Traitement des modules internes
        svg += `<g fill="${options.color}">`;
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if ((r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7)) continue;

            if (qr.isDark(r, c)) {
              const x = c * cellSize;
              const y = r * cellSize;

              if (options.moduleStyle === 'dots') {
                const cx = x + cellSize / 2;
                const cy = y + cellSize / 2;
                svg += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(cellSize / 2.3).toFixed(2)}"/>`;
              } else if (options.moduleStyle === 'smooth') {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}" rx="${(cellSize / 2).toFixed(2)}"/>`;
              } else {
                svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}"/>`;
              }
            }
          }
        }
        svg += `</g>`;

        // Cadrans (Yeux)
        const renderEye = (x, y) => {
          const eyeSize = 7 * cellSize;
          const innerSize = eyeSize - (2 * cellSize);

          if (options.eyeStyle === 'circle') {
            const center = x + eyeSize / 2;
            const centerY = y + eyeSize / 2;
            return `
              <g>
                <circle cx="${center}" cy="${centerY}" r="${eyeSize / 2}" fill="${options.color}"/>
                <circle cx="${center}" cy="${centerY}" r="${innerSize / 2}" fill="${options.bgColor}"/>
                <circle cx="${center}" cy="${centerY}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else if (options.eyeStyle === 'rounded') {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" rx="${cellSize * 2}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" rx="${cellSize}" fill="${options.bgColor}"/>
                <circle cx="${x + eyeSize/2}" cy="${y + eyeSize/2}" r="${cellSize * 1.5}" fill="${options.color}"/>
              </g>`;
          } else {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${eyeSize}" height="${eyeSize}" fill="${options.color}"/>
                <rect x="${x + cellSize}" y="${y + cellSize}" width="${innerSize}" height="${innerSize}" fill="${options.bgColor}"/>
                <rect x="${x + 2*cellSize}" y="${y + 2*cellSize}" width="${3*cellSize}" height="${3*cellSize}" fill="${options.color}"/>
              </g>`;
          }
        };

        svg += renderEye(0, 0);
        svg += renderEye((count - 7) * cellSize, 0);
        svg += renderEye(0, (count - 7) * cellSize);

        // Logo central masqué
        if (options.logoUrl) {
          const logoSize = size * 0.22;
          const center = (size - logoSize) / 2;
          svg += `
            <rect x="${center - 6}" y="${center - 6}" width="${logoSize + 12}" height="${logoSize + 12}" fill="${options.bgColor}" rx="12"/>
            <image href="${options.logoUrl}" x="${center}" y="${center}" width="${logoSize}" height="${logoSize}"/>`;
        }

        svg += `</svg>`;
        return svg;
      }
    }

    // --- LOGIQUE METIER ET INTERACTION ---
    function getOptions() {
      return {
        text: document.getElementById('qr-text').value.trim() || 'https://mamadounia.github.io/generateur-qr/',
        color: document.getElementById('qr-color').value,
        bgColor: document.getElementById('bg-color').value,
        moduleStyle: document.getElementById('module-style').value,
        eyeStyle: document.getElementById('eye-style').value,
        logoUrl: document.getElementById('logo-url').value.trim()
      };
    }

    function renderUI() {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      document.getElementById('qr-svg-container').innerHTML = svgString;
      
      // Ajuste la lueur (glow) selon la couleur du néon
      document.getElementById('qr-frame').style.boxShadow = `0 0 30px ${options.color}66`;
    }

    function applyPreset(url, logo) {
      document.getElementById('qr-text').value = url;
      document.getElementById('logo-url').value = logo;
      
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');

      renderUI();
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement('a');
      const file = new Blob([content], { type: contentType });
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Export PNG
    document.getElementById('dl-png').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      const img = new Image();
      
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1000, 1000);
        
        const a = document.createElement('a');
        a.download = 'cyber-qrcode.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    // Export SVG
    document.getElementById('dl-svg').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      downloadFile(svgString, 'cyber-qrcode.svg', 'image/svg+xml');
    });

    // Export PDF
    document.getElementById('dl-pdf').addEventListener('click', () => {
      const options = getOptions();
      const svgString = CyberQREngine.generateSVGString(options.text, options);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 800, 800);

        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.setTextColor(0, 243, 255);
        doc.text('CyberQR Holographic Record', 105, 25, { align: 'center' });

        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(150);
        doc.text(`Target URL : ${options.text}`, 105, 34, { align: 'center' });

        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 55, 45, 100, 100);

        doc.setFontSize(9);
        doc.text('Generated via CyberQR Engine', 105, 160, { align: 'center' });
        doc.save('cyber-qrcode.pdf');
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });

    // Événements d'écoute en temps réel
    ['qr-text', 'module-style', 'eye-style', 'qr-color', 'bg-color', 'logo-url'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderUI);
    });

    // Initialisation
    window.onload = renderUI;
  </script>
</body>
</html>
