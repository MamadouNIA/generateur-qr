<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Multi-Réseaux & Générateur de QR Code (PNG, SVG, PDF)</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- jsPDF Library pour la génération PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-width: 1000px;
      width: 100%;
    }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1, h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px 12px 10px 40px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="color"] {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { opacity: 0.9; }

    .btn-png { background-color: #10b981; }
    .btn-svg { background-color: #f59e0b; }
    .btn-pdf { background-color: #ef4444; }

    .preview-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 15px 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .social-link-item:hover {
      transform: translateX(4px);
      border-color: var(--accent-color);
    }

    .social-link-item i {
      font-size: 1.2rem;
      margin-right: 12px;
      width: 24px;
      text-align: center;
    }

    /* Brand Colors */
    .fa-whatsapp { color: #25D366; }
    .fa-instagram { color: #E4405F; }
    .fa-linkedin { color: #0A66C2; }
    .fa-facebook { color: #1877F2; }
    .fa-tiktok { color: #EE1D52; }
    .fa-x-twitter { color: #ffffff; }
    .fa-globe { color: #3b82f6; }

    #qr-output {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin: 15px 0;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Side -->
    <div class="card">
      <h1><i class="fa-solid fa-share-nodes"></i> Configuration du Hub</h1>

      <div class="form-group">
        <label>Nom du profil / Titre</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Mon Profil Social" placeholder="Ex: Jean Dupont">
        </div>
      </div>

      <div class="form-group">
        <label>WhatsApp (Numéro complet)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-whatsapp"></i>
          <input type="text" class="social-input" data-platform="whatsapp" placeholder="Ex: 221770000000">
        </div>
      </div>

      <div class="form-group">
        <label>Instagram (Nom d'utilisateur)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" class="social-input" data-platform="instagram" placeholder="Ex: mon_pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>LinkedIn (URL ou Identifiant)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-linkedin"></i>
          <input type="text" class="social-input" data-platform="linkedin" placeholder="Ex: in/mon-profil">
        </div>
      </div>

      <div class="form-group">
        <label>TikTok (Nom d'utilisateur)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-tiktok"></i>
          <input type="text" class="social-input" data-platform="tiktok" placeholder="Ex: @mon_pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>Facebook (Page / Profil)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-facebook"></i>
          <input type="text" class="social-input" data-platform="facebook" placeholder="Ex: ma.page">
        </div>
      </div>

      <div class="form-group">
        <label>X / Twitter (Nom d'utilisateur)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-x-twitter"></i>
          <input type="text" class="social-input" data-platform="x" placeholder="Ex: mon_pseudo">
        </div>
      </div>

      <div class="form-group">
        <label>Site Web / Portfolio</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-globe"></i>
          <input type="url" class="social-input" data-platform="website" placeholder="Ex: https://mon-site.com">
        </div>
      </div>

      <div class="color-picker-grid">
        <div class="form-group">
          <label>Couleur QR Code</label>
          <input type="color" id="qr-color-dark" value="#0f172a">
        </div>
        <div class="form-group">
          <label>Fond QR Code</label>
          <input type="color" id="qr-color-light" value="#ffffff">
        </div>
      </div>
    </div>

    <!-- Preview & Export Side -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <h2><i class="fa-solid fa-qrcode"></i> Aperçu & QR Code</h2>
        <div id="qr-output"></div>
        <div class="social-links-list" id="links-preview"></div>
      </div>

      <!-- Boutons d'exportation PNG / SVG / PDF -->
      <div class="btn-group">
        <button id="download-png" class="btn btn-png">
          <i class="fa-solid fa-file-image"></i> Télécharger en PNG
        </button>
        <button id="download-svg" class="btn btn-svg">
          <i class="fa-solid fa-vector-square"></i> Télécharger en SVG (Vectoriel)
        </button>
        <button id="download-pdf" class="btn btn-pdf">
          <i class="fa-solid fa-file-pdf"></i> Télécharger en PDF (Impression)
        </button>
      </div>
    </div>
  </div>

  <script>
    const profileNameInput = document.getElementById('profile-name');
    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const qrOutput = document.getElementById('qr-output');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');

    const config = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/", icon: "fa-brands fa-linkedin", name: "LinkedIn" },
      tiktok: { prefix: "https://tiktok.com/", icon: "fa-brands fa-tiktok", name: "TikTok" },
      facebook: { prefix: "https://facebook.com/", icon: "fa-brands fa-facebook", name: "Facebook" },
      x: { prefix: "https://x.com/", icon: "fa-brands fa-x-twitter", name: "X (Twitter)" },
      website: { prefix: "", icon: "fa-solid fa-globe", name: "Site Web" }
    };

    function buildProfileData() {
      const activeLinks = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website') {
            const cleanVal = val.replace(/^https?:\/\/(www\.)?/, '').replace(/^@/, '');
            url = config[platform].prefix + cleanVal;
          }
          activeLinks.push({
            platform: platform,
            url: url,
            name: config[platform].name,
            icon: config[platform].icon
          });
        }
      });
      return activeLinks;
    }

    function updateApp() {
      const links = buildProfileData();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Remplissez au moins un champ pour voir l\'aperçu.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.innerHTML = `<i class="${item.icon}"></i> ${item.name}`;
          linksPreview.appendChild(a);
        });
      }

      const qrTarget = links.length > 0 ? links[0].url : "https://github.com";

      qrOutput.innerHTML = '';
      new QRCode(qrOutput, {
        text: qrTarget,
        width: 200,
        height: 200,
        colorDark: qrColorDark.value,
        colorLight: qrColorLight.value,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // --- LOGIQUE DE TÉLÉCHARGEMENT ---

    // 1. Export PNG
    document.getElementById('download-png').addEventListener('click', () => {
      const img = qrOutput.querySelector('img');
      const canvas = qrOutput.querySelector('canvas');
      let imageSrc = img && img.src ? img.src : (canvas ? canvas.toDataURL("image/png") : null);

      if (imageSrc) {
        const a = document.createElement('a');
        a.href = imageSrc;
        a.download = 'qrcode_reseaux.png';
        a.click();
      }
    });

    // 2. Export SVG (Convertit le Canvas en élément SVG vectoriel)
    document.getElementById('download-svg').addEventListener('click', () => {
      const canvas = qrOutput.querySelector('canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const imgData = ctx.getImageData(0, 0, width, height);

      let svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
      svgString += `<rect width="${width}" height="${height}" fill="${qrColorLight.value}"/>`;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index = (y * width + x) * 4;
          const alpha = imgData.data[index + 3];
          if (alpha > 0) {
            const r = imgData.data[index];
            const g = imgData.data[index + 1];
            const b = imgData.data[index + 2];
            // Si la couleur n'est pas blanche
            if (!(r > 240 && g > 240 && b > 240)) {
              svgString += `<rect x="${x}" y="${y}" width="1" height="1" fill="${qrColorDark.value}"/>`;
            }
          }
        }
      }
      svgString += '</svg>';

      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode_vectoriel.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    // 3. Export PDF (Utilise jsPDF pour créer une fiche prête pour l'impression)
    document.getElementById('download-pdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const canvas = qrOutput.querySelector('canvas');

      if (!canvas) return;

      const imgData = canvas.toDataURL('image/png');
      const profileName = profileNameInput.value.trim() || "Mon Profil Social";

      // Titre PDF
      doc.setFontSize(22);
      doc.setTextColor(15, 23, 42);
      doc.text(profileName, 105, 30, { align: "center" });

      doc.setFontSize(12);
      doc.setTextColor(100, 100, 100);
      doc.text("Scannez le QR code pour accéder à tous mes profils sociaux", 105, 40, { align: "center" });

      // Inserer l'image du QR code centrée
      doc.addImage(imgData, 'PNG', 55, 55, 100, 100);

      // Pied de page
      doc.setFontSize(10);
      doc.text("Généré via Hub QR Réseaux Sociaux", 105, 175, { align: "center" });

      // Télécharger
      doc.save('qrcode_impression.pdf');
    });

    // Écouteurs d'événements
    socialInputs.forEach(input => input.addEventListener('input', updateApp));
    profileNameInput.addEventListener('input', updateApp);
    qrColorDark.addEventListener('input', updateApp);
    qrColorLight.addEventListener('input', updateApp);

    updateApp();
  </script>
</body>
</html>
