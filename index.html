<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberBio Studio — Bio-Link Generator Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --bg-dark: #030712;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border-glow: rgba(0, 243, 255, 0.25);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 243, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(255, 0, 85, 0.08) 0px, transparent 50%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: #f3f4f6;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .cyber-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15);
      width: 100%;
      max-width: 1100px;
      padding: 35px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 35px;
    }

    @media (max-width: 900px) {
      .cyber-card { grid-template-columns: 1fr; padding: 20px; }
    }

    .title-zone { grid-column: 1 / -1; text-align: center; margin-bottom: 10px; }

    .title-zone h1 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-zone p { color: #9ca3af; font-size: 1rem; }

    .control-group { margin-bottom: 18px; }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 1.05rem;
      outline: none;
      transition: all 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .multi-social-container {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .multi-social-container::-webkit-scrollbar { width: 6px; }
    .multi-social-container::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 4px; }

    .social-input-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .social-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-title);
      font-size: 0.75rem;
      color: #fff;
    }

    .social-card-header img { width: 18px; height: 18px; }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 8px;
    }

    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    /* PREVIEW CONTAINER */
    .preview-stage {
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .preview-phone-frame {
      width: 100%;
      max-width: 320px;
      min-height: 480px;
      background: #030712;
      border: 2px solid var(--border-glow);
      border-radius: 24px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
      transition: all 0.3s;
    }

    .preview-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), #000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-size: 1.8rem;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .preview-title { font-family: var(--font-title); font-size: 1.1rem; text-align: center; margin-bottom: 4px; }
    .preview-sub { font-size: 0.85rem; color: #9ca3af; text-align: center; margin-bottom: 20px; }

    .preview-links { width: 100%; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    
    .preview-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      font-family: var(--font-title);
      font-size: 0.7rem;
      text-decoration: none;
    }

    .preview-btn img { width: 16px; height: 16px; }

    .btn-cyber-primary {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: linear-gradient(90deg, #00f3ff, #0066ff);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    .btn-cyber-primary:hover {
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="cyber-card">
    <div class="title-zone">
      <h1>CyberBio Studio</h1>
      <p>// Générateur Indépendant de Page Bio-Link Multi-Réseaux</p>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="grid-2 control-group">
        <div>
          <label>👤 Nom du Profil</label>
          <input type="text" id="bio-title" value="Alex Cyber" placeholder="Votre Nom / Marque">
        </div>
        <div>
          <label>💬 Bio / Sous-titre</label>
          <input type="text" id="bio-subtitle" value="Créateur Digital & Designer" placeholder="Une courte description">
        </div>
      </div>

      <div class="control-group">
        <label>🎨 Thème Accent Néon</label>
        <div class="color-input-wrapper">
          <input type="color" id="theme-color" value="#00f3ff">
          <span style="font-size:0.85rem; color:#aaa;">Couleur des bordures & lueurs</span>
        </div>
      </div>

      <div class="control-group">
        <label>🌐 Vos Réseaux Sociaux (12 Canaux)</label>
        <div class="multi-social-container">
          
          <div class="social-input-card" style="border-left-color: #E1306C;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3938/3938036.png" alt="Insta"> Instagram</div>
            <input type="text" class="multi-social-link" data-name="Instagram" data-icon="https://cdn-icons-png.flaticon.com/512/3938/3938036.png" value="https://instagram.com/votre_pseudo" placeholder="https://instagram.com/votre_pseudo">
          </div>

          <div class="social-input-card" style="border-left-color: #25D366;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp"> WhatsApp</div>
            <input type="text" class="multi-social-link" data-name="WhatsApp" data-icon="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" value="https://wa.me/33600000000" placeholder="https://wa.me/33600000000">
          </div>

          <div class="social-input-card" style="border-left-color: #0A66C2;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"> LinkedIn</div>
            <input type="text" class="multi-social-link" data-name="LinkedIn" data-icon="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" placeholder="https://linkedin.com/in/votre_profil">
          </div>

          <div class="social-input-card" style="border-left-color: #1877F2;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook"> Facebook</div>
            <input type="text" class="multi-social-link" data-name="Facebook" data-icon="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" placeholder="https://facebook.com/votre_page">
          </div>

          <div class="social-input-card" style="border-left-color: #ffffff;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/5969/5968830.png" alt="X"> X / Twitter</div>
            <input type="text" class="multi-social-link" data-name="X / Twitter" data-icon="https://cdn-icons-png.flaticon.com/512/5969/5968830.png" placeholder="https://x.com/votre_profil">
          </div>

          <div class="social-input-card" style="border-left-color: #FF0000;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"> YouTube</div>
            <input type="text" class="multi-social-link" data-name="YouTube" data-icon="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" placeholder="https://youtube.com/@votre_chaine">
          </div>

          <div class="social-input-card" style="border-left-color: #fe2c55;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" alt="TikTok"> TikTok</div>
            <input type="text" class="multi-social-link" data-name="TikTok" data-icon="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" placeholder="https://tiktok.com/@votre_compte">
          </div>

          <div class="social-input-card" style="border-left-color: #0088cc;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram"> Telegram</div>
            <input type="text" class="multi-social-link" data-name="Telegram" data-icon="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" placeholder="https://t.me/votre_nom">
          </div>

          <div class="social-input-card" style="border-left-color: #FFFC00;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670013.png" alt="Snapchat"> Snapchat</div>
            <input type="text" class="multi-social-link" data-name="Snapchat" data-icon="https://cdn-icons-png.flaticon.com/512/3670/3670013.png" placeholder="https://snapchat.com/add/votre_pseudo">
          </div>

          <div class="social-input-card" style="border-left-color: #5865F2;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord"> Discord</div>
            <input type="text" class="multi-social-link" data-name="Discord" data-icon="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" placeholder="https://discord.gg/votre_serveur">
          </div>

          <div class="social-input-card" style="border-left-color: #EA4335;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email"> Email Direct</div>
            <input type="text" class="multi-social-link" data-name="Email" data-icon="https://cdn-icons-png.flaticon.com/512/732/732200.png" placeholder="mailto:contact@domaine.com">
          </div>

          <div class="social-input-card" style="border-left-color: #34A853;">
            <div class="social-card-header"><img src="https://cdn-icons-png.flaticon.com/512/126/126509.png" alt="Phone"> Appel Téléphonique</div>
            <input type="text" class="multi-social-link" data-name="Téléphone" data-icon="https://cdn-icons-png.flaticon.com/512/126/126509.png" placeholder="tel:+33600000000">
          </div>

        </div>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div class="preview-stage">
      <label>📱 Aperçu en Temps Réel</label>
      
      <div class="preview-phone-frame" id="phone-frame">
        <div class="preview-avatar" id="prev-avatar">A</div>
        <div class="preview-title" id="prev-title">Alex Cyber</div>
        <div class="preview-sub" id="prev-sub">Créateur Digital & Designer</div>
        <div class="preview-links" id="prev-links"></div>
      </div>

      <button class="btn-cyber-primary" onclick="exportBioLinkPage()">🚀 Télécharger la Page (.HTML)</button>
    </div>
  </div>

  <script>
    function updatePreview() {
      const title = document.getElementById('bio-title').value.trim() || 'Mon Profil';
      const subtitle = document.getElementById('bio-subtitle').value.trim() || 'Bienvenue sur mes liens';
      const color = document.getElementById('theme-color').value;

      document.getElementById('prev-title').innerText = title;
      document.getElementById('prev-sub').innerText = subtitle;
      document.getElementById('prev-avatar').innerText = title.charAt(0).toUpperCase();

      // Update phone styling
      const frame = document.getElementById('phone-frame');
      frame.style.borderColor = color;
      frame.style.boxShadow = `0 0 25px ${color}33`;
      document.getElementById('prev-avatar').style.background = `linear-gradient(135deg, ${color}, #000)`;
      document.getElementById('prev-avatar').style.boxShadow = `0 0 15px ${color}`;

      // Render links
      const linksContainer = document.getElementById('prev-links');
      linksContainer.innerHTML = '';

      const inputs = document.querySelectorAll('.multi-social-link');
      inputs.forEach(input => {
        const val = input.value.trim();
        const name = input.dataset.name;
        const icon = input.dataset.icon;

        if (val) {
          const a = document.createElement('div');
          a.className = 'preview-btn';
          a.style.borderColor = `${color}44`;
          a.innerHTML = `<img src="${icon}" alt="${name}"> <span>${name}</span>`;
          linksContainer.appendChild(a);
        }
      });
    }

    function exportBioLinkPage() {
      const title = document.getElementById('bio-title').value.trim() || 'Mon Profil';
      const subtitle = document.getElementById('bio-subtitle').value.trim() || '';
      const color = document.getElementById('theme-color').value;

      const inputs = document.querySelectorAll('.multi-social-link');
      let linksHTML = '';

      inputs.forEach(input => {
        const val = input.value.trim();
        const name = input.dataset.name;
        const icon = input.dataset.icon;
        if (val) {
          linksHTML += `
            <a href="${val}" target="_blank" class="bio-btn">
              <img src="${icon}" alt="${name}">
              <span>${name}</span>
            </a>`;
        }
      });

      const pageHTML = `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} — Bio Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      background-image: radial-gradient(circle at 50% 0%, ${color}22 0%, transparent 70%);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .bio-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid ${color}44;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 40px ${color}22;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, ${color}, #000);
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 20px ${color}66;
    }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; letter-spacing: 1.5px; margin-bottom: 6px; }
    p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 25px; }
    .links-container { display: flex; flex-direction: column; gap: 12px; }
    .bio-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 20px;
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bio-btn:hover {
      background: ${color}22;
      border-color: ${color};
      transform: translateY(-3px);
      box-shadow: 0 5px 20px ${color}44;
    }
    .bio-btn img { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div class="bio-card">
    <div class="avatar">${title.charAt(0).toUpperCase()}</div>
    <h1>${title}</h1>
    <p>${subtitle}</p>
    <div class="links-container">
      ${linksHTML || '<p style="color:#aaa;">Aucun lien renseigné.</p>'}
    </div>
  </div>
</body>
</html>`;

      const a = document.createElement('a');
      const file = new Blob([pageHTML], { type: 'text/html' });
      a.href = URL.createObjectURL(file);
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Dynamic listeners
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', updatePreview);
    });

    window.onload = updatePreview;
  </script>
</body>
</html>
