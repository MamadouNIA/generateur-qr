<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>qrcodephoenix — Studio QR Code & Bio-Link Pro</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root[data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: rgba(31, 41, 55, 0.6);
      --accent-color: #f97316;
      --accent-hover: #ea580c;
      --focus-ring: rgba(249, 115, 22, 0.35);
    }

    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --accent-color: #ea580c;
      --accent-hover: #c2410c;
      --focus-ring: rgba(234, 88, 12, 0.25);
    }

    :root[data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(135deg, #0d0221 0%, #0f051d 100%);
      --card-bg: rgba(25, 10, 45, 0.85);
      --card-border: #facc15;
      --text-main: #00f6ff;
      --text-muted: #ff007f;
      --input-bg: rgba(10, 2, 25, 0.85);
      --accent-color: #facc15;
      --accent-hover: #eab308;
      --focus-ring: rgba(250, 204, 21, 0.4);
    }

    :root[data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #4c1d95 0%, #c2410c 100%);
      --card-bg: rgba(88, 28, 135, 0.65);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-main: #fff7ed;
      --text-muted: #fed7aa;
      --input-bg: rgba(67, 20, 96, 0.6);
      --accent-color: #fb923c;
      --accent-hover: #f97316;
      --focus-ring: rgba(251, 146, 60, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f97316 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      max-width: 1100px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title:first-child { margin-top: 0; }
    .card-title i { color: var(--accent-color); }

    .theme-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .theme-option {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .theme-option.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--focus-ring);
      color: var(--accent-color);
    }

    .preview-mode-toggle {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .toggle-btn.active {
      background: var(--accent-color);
      color: white;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    .form-group { margin-bottom: 14px; }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-icon i {
      position: absolute;
      left: 14px;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .input-with-icon i.fa-whatsapp { color: #25D366; }
    .input-with-icon i.fa-instagram { color: #E4405F; }
    .input-with-icon i.fa-linkedin { color: #0A66C2; }
    .input-with-icon i.fa-facebook { color: #1877F2; }
    .input-with-icon i.fa-x-twitter { color: #f9fafb; }
    .input-with-icon i.fa-tiktok { color: #FE2C55; }
    .input-with-icon i.fa-youtube { color: #FF0000; }
    .input-with-icon i.fa-telegram { color: #229ED9; }
    .input-with-icon i.fa-github { color: #a855f7; }
    .input-with-icon i.fa-globe { color: #3b82f6; }

    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      padding: 12px 14px 12px 44px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    select {
      padding-left: 14px;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }

    textarea {
      padding-left: 44px;
      resize: vertical;
      min-height: 70px;
    }

    input[type="text"]:focus, input[type="url"]:focus, select:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .color-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    .btn-validate {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--accent-color) 0%, #ff007f 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);
    }

    .btn-validate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(249, 115, 22, 0.5);
    }

    .btn-validate:active {
      transform: translateY(0);
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: sticky;
      top: 24px;
    }

    .qr-container-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.3);
      margin: 16px 0;
      display: inline-block;
    }

    canvas#modern-qr {
      display: block;
      border-radius: 4px;
      max-width: 100%;
      height: auto;
    }

    .phone-mockup {
      display: none;
      width: 100%;
      max-width: 320px;
      background: var(--input-bg);
      border: 8px solid #1e293b;
      border-radius: 36px;
      padding: 24px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin: 10px auto;
      text-align: center;
    }

    .phone-mockup.active { display: block; }

    .phone-notch {
      width: 100px;
      height: 14px;
      background: #1e293b;
      border-radius: 0 0 10px 10px;
      margin: -24px auto 18px auto;
    }

    .social-links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .social-link-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      word-break: break-all;
    }

    .social-link-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .social-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 1.1rem;
      color: #ffffff;
      flex-shrink: 0;
    }

    .icon-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
    .icon-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .icon-linkedin { background: linear-gradient(135deg, #0A66C2, #004182); }
    .icon-facebook { background: linear-gradient(135deg, #1877F2, #0d52a8); }
    .icon-x-twitter { background: linear-gradient(135deg, #24292e, #000000); }
    .icon-tiktok { background: linear-gradient(135deg, #00f2fe, #fe2c55); }
    .icon-youtube { background: linear-gradient(135deg, #FF0000, #b30000); }
    .icon-telegram { background: linear-gradient(135deg, #229ED9, #177aa7); }
    .icon-github { background: linear-gradient(135deg, #333333, #111111); }
    .icon-website { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-png { background: #10b981; }
    .btn-png:hover { background: #059669; }
    .btn-svg { background: #f59e0b; }
    .btn-svg:hover { background: #d97706; }
    .btn-pdf { background: #ef4444; }
    .btn-pdf:hover { background: #dc2626; }

    @media (max-width: 850px) {
      body { padding: 16px 10px; }
      .container { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 20px; }
      .theme-selector { grid-template-columns: repeat(2, 1fr); }
      .preview-card { position: relative; top: 0; }
    }

    .app-footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand-logo">
      <i class="fa-solid fa-fire-flame-curved"></i> qrcodephoenix
    </div>
    <div class="brand-subtitle">Studio d'Édition QR Code Vectoriel & Bio-Link Pro</div>
  </header>

  <div class="container">
    <!-- Panneau de Formulaire -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-palette"></i> Style & Thèmes
      </div>

      <div class="theme-selector">
        <div class="theme-option active" data-theme="dark">
          <i class="fa-solid fa-moon"></i> Dark
        </div>
        <div class="theme-option" data-theme="light">
          <i class="fa-solid fa-sun"></i> Light
        </div>
        <div class="theme-option" data-theme="cyberpunk">
          <i class="fa-solid fa-bolt"></i> Cyber
        </div>
        <div class="theme-option" data-theme="sunset">
          <i class="fa-solid fa-volcano"></i> Sunset
        </div>
      </div>

      <!-- RÉGLAGES DU QR CODE -->
      <div class="card-title">
        <i class="fa-solid fa-sliders"></i> Apparence du QR Code
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label for="qr-dots-style">Style des modules</label>
          <select id="qr-dots-style">
            <option value="square" selected>Carré Classique</option>
            <option value="dots">Arrondi (Dots)</option>
            <option value="rounded">Lisse (Rounded)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="qr-ecc-level">Correction d'erreur</label>
          <select id="qr-ecc-level">
            <option value="M" selected>Moyenne (15%)</option>
            <option value="H">Haute (30%)</option>
            <option value="Q">Élevée (25%)</option>
            <option value="L">Faible (7%)</option>
          </select>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label for="qr-margin">Marge (Quiet Zone)</label>
          <select id="qr-margin">
            <option value="2" selected>Standard (2)</option>
            <option value="1">Ajustée (1)</option>
            <option value="4">Large (4)</option>
            <option value="0">Aucune (0)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="qr-center-text">Badge Texte Central</label>
          <input type="text" id="qr-center-text" maxlength="4" placeholder="Ex: PRO" style="padding-left:14px;">
        </div>
      </div>

      <div class="form-group">
        <label>Couleurs du QR Code</label>
        <div class="color-picker-grid">
          <div class="color-picker-wrapper">
            <input type="color" id="qr-color-dark" value="#000000">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Code</span>
          </div>
          <div class="color-picker-wrapper">
            <input type="color" id="qr-color-light" value="#ffffff">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Fond</span>
          </div>
        </div>
      </div>

      <!-- INFORMATIONS DU PROFIL -->
      <div class="card-title">
        <i class="fa-solid fa-id-card"></i> Informations du Profil
      </div>

      <div class="form-group">
        <label for="profile-name">Nom complet ou Marque</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="profile-name" value="Alexandre Pro" placeholder="Votre nom / marque">
        </div>
      </div>

      <div class="form-group">
        <label for="profile-title">Titre / Profession</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-briefcase"></i>
          <input type="text" id="profile-title" value="Développeur & Designer" placeholder="Ex: Designer & Développeur">
        </div>
      </div>

      <div class="form-group">
        <label for="profile-bio">Description / Bio</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-align-left" style="top: 14px;"></i>
          <textarea id="profile-bio" placeholder="Description courte...">Bienvenue sur mon hub officiel. Retrouvez tous mes liens ci-dessous !</textarea>
        </div>
      </div>

      <div class="card-title">
        <i class="fa-solid fa-share-nodes"></i> Liens Réseaux Sociaux
      </div>

      <div class="form-group">
        <label for="input-whatsapp">WhatsApp</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-whatsapp"></i>
          <input type="text" id="input-whatsapp" class="social-input" data-platform="whatsapp" placeholder="Ex: 221770000000">
        </div>
      </div>

      <div class="form-group">
        <label for="input-instagram">Instagram</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" id="input-instagram" class="social-input" data-platform="instagram" placeholder="Nom d'utilisateur">
        </div>
      </div>

      <div class="form-group">
        <label for="input-linkedin">LinkedIn</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-linkedin"></i>
          <input type="text" id="input-linkedin" class="social-input" data-platform="linkedin" placeholder="Identifiant / URL">
        </div>
      </div>

      <div class="form-group">
        <label for="input-facebook">Facebook</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-facebook"></i>
          <input type="text" id="input-facebook" class="social-input" data-platform="facebook" placeholder="Profil ou page">
        </div>
      </div>

      <div class="form-group">
        <label for="input-twitter">X (Twitter)</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-x-twitter"></i>
          <input type="text" id="input-twitter" class="social-input" data-platform="twitter" placeholder="Nom d'utilisateur">
        </div>
      </div>

      <div class="form-group">
        <label for="input-tiktok">TikTok</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-tiktok"></i>
          <input type="text" id="input-tiktok" class="social-input" data-platform="tiktok" placeholder="Nom d'utilisateur">
        </div>
      </div>

      <div class="form-group">
        <label for="input-youtube">YouTube</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-youtube"></i>
          <input type="text" id="input-youtube" class="social-input" data-platform="youtube" placeholder="Nom de chaîne">
        </div>
      </div>

      <div class="form-group">
        <label for="input-telegram">Telegram</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-telegram"></i>
          <input type="text" id="input-telegram" class="social-input" data-platform="telegram" placeholder="Pseudo Telegram">
        </div>
      </div>

      <div class="form-group">
        <label for="input-github">GitHub</label>
        <div class="input-with-icon">
          <i class="fa-brands fa-github"></i>
          <input type="text" id="input-github" class="social-input" data-platform="github" placeholder="Pseudo GitHub">
        </div>
      </div>

      <div class="form-group">
        <label for="input-website">Site Web Officiel</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-globe"></i>
          <input type="url" id="input-website" class="social-input" data-platform="website" placeholder="https://votre-site.com">
        </div>
      </div>

      <!-- BOUTON EXPLICITE DE VALIDATION -->
      <button type="button" class="btn-validate" id="btn-submit-data">
        <i class="fa-solid fa-circle-check"></i> Valider et Générer le QR Code
      </button>

    </div>

    <!-- Panneau de Prévisualisation & Exporter -->
    <div class="card preview-card">
      <div style="width: 100%;">
        <div class="preview-mode-toggle">
          <button class="toggle-btn active" id="btn-mode-qr" type="button"><i class="fa-solid fa-qrcode"></i> Aperçu QR</button>
          <button class="toggle-btn" id="btn-mode-phone" type="button"><i class="fa-solid fa-mobile-screen"></i> Aperçu Bio-Link</button>
        </div>

        <!-- Mode QR -->
        <div id="view-qr-container">
          <div class="qr-container-box">
            <canvas id="modern-qr" width="280" height="280"></canvas>
            <div id="raw-qr" style="display:none;"></div>
          </div>
          <p style="font-size:0.8rem; color:var(--text-muted);">QR Code Immuable & Validé</p>
        </div>

        <!-- Mode Smartphone Bio-Link -->
        <div class="phone-mockup" id="view-phone-container">
          <div class="phone-notch"></div>
          <h4 id="prev-name" style="font-weight:700; font-size:1.1rem;">Alexandre Pro</h4>
          <div id="prev-title" style="color:var(--accent-color); font-size:0.8rem; font-weight:600; margin-top:2px;">Développeur</div>
          <p id="prev-bio" style="font-size:0.75rem; color:var(--text-muted); margin-top:6px; line-height:1.3;">Description...</p>
          <div class="social-links-list" id="links-preview"></div>
        </div>
      </div>

      <!-- Actions Téléchargement -->
      <div class="btn-group">
        <button id="download-png" class="btn btn-png" type="button"><i class="fa-solid fa-image"></i> Exporter PNG HD</button>
        <button id="download-svg" class="btn btn-svg" type="button"><i class="fa-solid fa-vector-square"></i> Exporter SVG Vectoriel</button>
        <button id="download-pdf" class="btn btn-pdf" type="button"><i class="fa-solid fa-file-pdf"></i> Exporter PDF HD</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Powered by <strong>qrcodephoenix</strong> — Studio Pro
  </footer>

  <script>
    const PLATFORMS = {
      whatsapp: { prefix: "https://wa.me/", icon: "fa-brands fa-whatsapp", badgeClass: "icon-whatsapp", name: "WhatsApp" },
      instagram: { prefix: "https://instagram.com/", icon: "fa-brands fa-instagram", badgeClass: "icon-instagram", name: "Instagram" },
      linkedin: { prefix: "https://linkedin.com/in/", icon: "fa-brands fa-linkedin", badgeClass: "icon-linkedin", name: "LinkedIn" },
      facebook: { prefix: "https://facebook.com/", icon: "fa-brands fa-facebook", badgeClass: "icon-facebook", name: "Facebook" },
      twitter: { prefix: "https://x.com/", icon: "fa-brands fa-x-twitter", badgeClass: "icon-x-twitter", name: "X (Twitter)" },
      tiktok: { prefix: "https://tiktok.com/@", icon: "fa-brands fa-tiktok", badgeClass: "icon-tiktok", name: "TikTok" },
      youtube: { prefix: "https://youtube.com/@", icon: "fa-brands fa-youtube", badgeClass: "icon-youtube", name: "YouTube" },
      telegram: { prefix: "https://t.me/", icon: "fa-brands fa-telegram", badgeClass: "icon-telegram", name: "Telegram" },
      github: { prefix: "https://github.com/", icon: "fa-brands fa-github", badgeClass: "icon-github", name: "GitHub" },
      website: { prefix: "", icon: "fa-solid fa-globe", badgeClass: "icon-website", name: "Site Web" }
    };

    // Identifiant de session fixe pour garder la cohérence du lien QR
    const FIXED_SESSION_ID = "hub-" + Math.floor(100000 + Math.random() * 900000);
    const FIXED_TARGET_URL = window.location.origin + window.location.pathname + "?id=" + FIXED_SESSION_ID;

    const profileNameInput = document.getElementById('profile-name');
    const profileTitleInput = document.getElementById('profile-title');
    const profileBioInput = document.getElementById('profile-bio');

    const prevName = document.getElementById('prev-name');
    const prevTitle = document.getElementById('prev-title');
    const prevBio = document.getElementById('prev-bio');

    const socialInputs = document.querySelectorAll('.social-input');
    const linksPreview = document.getElementById('links-preview');
    const rawQrContainer = document.getElementById('raw-qr');
    const modernCanvas = document.getElementById('modern-qr');

    const qrDotsStyle = document.getElementById('qr-dots-style');
    const qrEccLevel = document.getElementById('qr-ecc-level');
    const qrMargin = document.getElementById('qr-margin');
    const qrCenterText = document.getElementById('qr-center-text');
    const qrColorDark = document.getElementById('qr-color-dark');
    const qrColorLight = document.getElementById('qr-color-light');

    const btnSubmitData = document.getElementById('btn-submit-data');

    const themeOptions = document.querySelectorAll('.theme-option');
    const btnModeQr = document.getElementById('btn-mode-qr');
    const btnModePhone = document.getElementById('btn-mode-phone');
    const viewQrContainer = document.getElementById('view-qr-container');
    const viewPhoneContainer = document.getElementById('view-phone-container');

    let currentQRMatrix = [];

    btnModeQr.addEventListener('click', () => {
      btnModeQr.classList.add('active');
      btnModePhone.classList.remove('active');
      viewQrContainer.style.display = 'block';
      viewPhoneContainer.classList.remove('active');
    });

    btnModePhone.addEventListener('click', () => {
      btnModePhone.classList.add('active');
      btnModeQr.classList.remove('active');
      viewQrContainer.style.display = 'none';
      viewPhoneContainer.classList.add('active');
    });

    themeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        themeOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        document.documentElement.setAttribute('data-theme', opt.dataset.theme);
      });
    });

    function getActiveLinks() {
      const active = [];
      socialInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          const platform = input.dataset.platform;
          let url = val;
          if (platform !== 'website' && !val.startsWith('http')) {
            const clean = val.replace(/^@/, '');
            url = PLATFORMS[platform].prefix + clean;
          }
          active.push({ 
            platform, 
            url, 
            name: PLATFORMS[platform].name, 
            icon: PLATFORMS[platform].icon,
            badgeClass: PLATFORMS[platform].badgeClass
          });
        }
      });
      return active;
    }

    function extractMatrixFromCanvas(sourceCanvas) {
      const ctx = sourceCanvas.getContext('2d');
      const size = sourceCanvas.width;
      const imgData = ctx.getImageData(0, 0, size, size);

      let firstBlackPixel = -1;
      for (let i = 0; i < size * size; i++) {
        if (imgData.data[i * 4] < 127) {
          firstBlackPixel = i;
          break;
        }
      }

      if (firstBlackPixel === -1) return [];

      let modulePixelCount = 0;
      for (let x = firstBlackPixel % size; x < size; x++) {
        if (imgData.data[(Math.floor(firstBlackPixel / size) * size + x) * 4] < 127) {
          modulePixelCount++;
        } else {
          break;
        }
      }

      const moduleSize = modulePixelCount / 7;
      const matrixCount = Math.round(size / moduleSize);
      const cellSize = size / matrixCount;

      const matrix = [];
      for (let r = 0; r < matrixCount; r++) {
        const row = [];
        for (let c = 0; c < matrixCount; c++) {
          const sampleX = Math.floor((c + 0.5) * cellSize);
          const sampleY = Math.floor((r + 0.5) * cellSize);
          const idx = (sampleY * size + sampleX) * 4;
          row.push(imgData.data[idx] < 127 ? 1 : 0);
        }
        matrix.push(row);
      }
      return matrix;
    }

    function isFinderPattern(r, c, count) {
      if (r < 7 && c < 7) return true;
      if (r < 7 && c >= count - 7) return true;
      if (r >= count - 7 && c < 7) return true;
      return false;
    }

    function renderCustomQR(matrix) {
      if (!matrix || matrix.length === 0) return;

      const baseCount = matrix.length;
      const margin = parseInt(qrMargin.value, 10);
      const totalCount = baseCount + margin * 2;

      const canvasSize = 320;
      modernCanvas.width = canvasSize;
      modernCanvas.height = canvasSize;

      const ctx = modernCanvas.getContext('2d');
      const cellSize = canvasSize / totalCount;
      const shapeStyle = qrDotsStyle.value;

      ctx.fillStyle = qrColorLight.value;
      ctx.fillRect(0, 0, canvasSize, canvasSize);

      ctx.fillStyle = qrColorDark.value;

      const centerText = qrCenterText.value.trim();
      const centerBoxSize = centerText ? Math.floor(totalCount * 0.26) : 0;
      const centerStart = Math.floor((totalCount - centerBoxSize) / 2);
      const centerEnd = centerStart + centerBoxSize;

      currentQRMatrix = [];

      for (let r = 0; r < totalCount; r++) {
        const matrixRow = [];
        for (let c = 0; c < totalCount; c++) {
          let isDark = 0;
          const origR = r - margin;
          const origC = c - margin;

          if (origR >= 0 && origR < baseCount && origC >= 0 && origC < baseCount) {
            isDark = matrix[origR][origC];
          }

          if (centerText && r >= centerStart && r < centerEnd && c >= centerStart && c < centerEnd) {
            isDark = 0;
          }

          matrixRow.push(isDark);

          if (isDark) {
            const x = c * cellSize;
            const y = r * cellSize;
            const isFinder = isFinderPattern(origR, origC, baseCount);

            if (shapeStyle === 'square' || isFinder) {
              ctx.fillRect(x, y, cellSize + 0.4, cellSize + 0.4);
            } else if (shapeStyle === 'dots') {
              ctx.beginPath();
              ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 2.2, 0, Math.PI * 2);
              ctx.fill();
            } else if (shapeStyle === 'rounded') {
              const rRadius = cellSize * 0.35;
              ctx.beginPath();
              ctx.roundRect(x, y, cellSize, cellSize, rRadius);
              ctx.fill();
            }
          }
        }
        currentQRMatrix.push(matrixRow);
      }

      if (centerText) {
        const badgeX = centerStart * cellSize;
        const badgeY = centerStart * cellSize;
        const badgeWidth = centerBoxSize * cellSize;

        ctx.fillStyle = qrColorLight.value;
        ctx.beginPath();
        ctx.roundRect(badgeX + 2, badgeY + 2, badgeWidth - 4, badgeWidth - 4, 8);
        ctx.fill();

        ctx.strokeStyle = qrColorDark.value;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = qrColorDark.value;
        ctx.font = `800 ${Math.floor(badgeWidth * 0.35)}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(centerText.toUpperCase(), badgeX + badgeWidth / 2, badgeY + badgeWidth / 2);
      }
    }

    function generateQR() {
      rawQrContainer.innerHTML = '';

      const eccMap = {
        'L': QRCode.CorrectLevel.L,
        'M': QRCode.CorrectLevel.M,
        'Q': QRCode.CorrectLevel.Q,
        'H': QRCode.CorrectLevel.H
      };

      new QRCode(rawQrContainer, {
        text: FIXED_TARGET_URL,
        width: 280,
        height: 280,
        correctLevel: eccMap[qrEccLevel.value] || QRCode.CorrectLevel.M
      });

      setTimeout(() => {
        const sourceCanvas = rawQrContainer.querySelector('canvas');
        if (!sourceCanvas) return;
        const rawMatrix = extractMatrixFromCanvas(sourceCanvas);
        renderCustomQR(rawMatrix);
      }, 60);
    }

    // FONCTION PRINCIPALE DE VALIDATION
    function validateAndApplyData() {
      prevName.textContent = profileNameInput.value.trim() || "Alexandre Pro";
      prevTitle.textContent = profileTitleInput.value.trim();
      prevBio.textContent = profileBioInput.value.trim();

      prevTitle.style.display = profileTitleInput.value.trim() ? "block" : "none";
      prevBio.style.display = profileBioInput.value.trim() ? "block" : "none";

      const links = getActiveLinks();
      linksPreview.innerHTML = '';

      if (links.length === 0) {
        linksPreview.innerHTML = '<p style="color:var(--text-muted); font-size:0.75rem;">Aucun lien renseigné.</p>';
      } else {
        links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'social-link-item';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.innerHTML = `
            <div class="social-icon-badge ${item.badgeClass}">
              <i class="${item.icon}"></i>
            </div>
            <span>${item.name}</span>
          `;
          linksPreview.appendChild(a);
        });
      }

      generateQR();
    }

    // ÉCOUTEUR PRINCIPAL DU BOUTON VALIDATION
    btnSubmitData.addEventListener('click', validateAndApplyData);

    // EXPORTS
    document.getElementById('download-png').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'qrcodephoenix.png';
      link.href = modernCanvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('download-svg').addEventListener('click', () => {
      if (!currentQRMatrix || currentQRMatrix.length === 0) return;

      const totalCount = currentQRMatrix.length;
      const margin = parseInt(qrMargin.value, 10);
      const baseCount = totalCount - margin * 2;
      const svgSize = 500;
      const cellSize = svgSize / totalCount;
      const shapeStyle = qrDotsStyle.value;

      let shapesSVG = "";

      for (let r = 0; r < totalCount; r++) {
        for (let c = 0; c < totalCount; c++) {
          if (currentQRMatrix[r][c] === 1) {
            const x = c * cellSize;
            const y = r * cellSize;
            const origR = r - margin;
            const origC = c - margin;
            const isFinder = isFinderPattern(origR, origC, baseCount);

            if (shapeStyle === 'square' || isFinder) {
              shapesSVG += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${(cellSize + 0.3).toFixed(2)}" height="${(cellSize + 0.3).toFixed(2)}" fill="${qrColorDark.value}"/>`;
            } else if (shapeStyle === 'dots') {
              const cx = (x + cellSize / 2).toFixed(2);
              const cy = (y + cellSize / 2).toFixed(2);
              const radius = (cellSize / 2.2).toFixed(2);
              shapesSVG += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${qrColorDark.value}"/>`;
            } else if (shapeStyle === 'rounded') {
              shapesSVG += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}" rx="${(cellSize * 0.35).toFixed(2)}" fill="${qrColorDark.value}"/>`;
            }
          }
        }
      }

      const centerText = qrCenterText.value.trim();
      let textSVG = "";
      if (centerText) {
        const centerBoxSize = Math.floor(totalCount * 0.26);
        const centerStart = Math.floor((totalCount - centerBoxSize) / 2);
        const badgeX = centerStart * cellSize;
        const badgeY = centerStart * cellSize;
        const badgeWidth = centerBoxSize * cellSize;

        textSVG = `
          <rect x="${badgeX + 2}" y="${badgeY + 2}" width="${badgeWidth - 4}" height="${badgeWidth - 4}" rx="8" fill="${qrColorLight.value}" stroke="${qrColorDark.value}" stroke-width="2"/>
          <text x="${badgeX + badgeWidth / 2}" y="${badgeY + badgeWidth / 2 + 5}" fill="${qrColorDark.value}" font-size="${Math.floor(badgeWidth * 0.35)}" font-weight="800" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle" dominant-baseline="middle">${centerText.toUpperCase()}</text>
        `;
      }

      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgSize} ${svgSize}" width="${svgSize}" height="${svgSize}"><rect width="100%" height="100%" fill="${qrColorLight.value}"/>${shapesSVG}${textSVG}</svg>`;
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'qrcodephoenix.svg';
      link.click();
    });

    document.getElementById('download-pdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const name = profileNameInput.value.trim() || "qrcodephoenix Hub";

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');
      
      doc.setFontSize(26);
      doc.setTextColor(249, 115, 22);
      doc.text("qrcodephoenix", 105, 35, { align: 'center' });

      doc.setFontSize(18);
      doc.setTextColor(248, 250, 252);
      doc.text(name, 105, 48, { align: 'center' });
      
      if(profileTitleInput.value.trim()) {
        doc.setFontSize(11);
        doc.setTextColor(148, 163, 184);
        doc.text(profileTitleInput.value.trim(), 105, 55, { align: 'center' });
      }

      doc.addImage(modernCanvas.toDataURL('image/png'), 'PNG', 55, 75, 100, 100);
      
      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text("Scannez pour ouvrir le hub mobile officiel", 105, 185, { align: 'center' });

      doc.save(`QRCodePhoenix_${name.replace(/\s+/g, '_')}.pdf`);
    });

    // Génération initiale au chargement
    validateAndApplyData();
  </script>
</body>
</html>
